  .markdown { font-size: 17px; line-height: 1.6; overflow-wrap: anywhere; }

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const app = new Framework7({ el: "#app", name: "overlook", theme: "ios", darkMode: "auto" });
// The launch URL reserves its hash for the credential and its query for the agent.
app.views.create(".view-main", { router: false });

function htmlText(text) {
  return String(text).replace(/[&<>"']/g, (character) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[character]);
}

function confirmAction(message, {title = "Confirm action", label, danger} = {}) {
  const inferred = /^(delete|remove|kill|stop|restart|reload|close|start)\b/i.exec(message)?.[1]?.toLowerCase();
  label ||= ({delete: "Delete", remove: "Remove", kill: "End conversation", stop: "Stop task", restart: "New conversation", reload: "Reload session", close: "Close", start: "Start"})[inferred] || "Confirm";
  danger ??= /delete|remove|kill|stop|restart/i.test(inferred || "");
  return new Promise((resolve) => {
    const previous = document.activeElement;
    app.dialog.create({ title: htmlText(title), text: htmlText(message), destroyOnClose: true,
      on: { closed: () => { resolve(false); if (previous?.isConnected) previous.focus({preventScroll: true}); } },
      buttons: [{ text: "Cancel", onClick: () => resolve(false) },
        { text: htmlText(label), bold: true, color: danger ? "red" : undefined, onClick: () => resolve(true) }] }).open();
  });
}

if (location.hash.length > 1) {
  localStorage.setItem("overlook-token", location.hash.slice(1));
}
const token = localStorage.getItem("overlook-token");
// Home Screen apps have their own storage; keep the credential in their launch URL.
if (token && !location.hash) {
  history.replaceState(null, "", location.pathname + location.search + "#" + token);
}

function toast(message) {
  toast.current?.close();
  toast.current = app.toast.create({ text: htmlText(message),
    closeTimeout: 4000, destroyOnClose: true });
  toast.current.open();
}

let lastSync = null;
let connectionBlocked = false;
let viewGeneration = 0;
function connected() {
  lastSync = new Date();
  connectionBlocked = false;
  $("conn").textContent = "Updated " + lastSync.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
  $("conn").title = "Last synced: " + lastSync.toLocaleString();
  $("connection").hidden = true;
  $("connection").removeAttribute("data-error");
  $("dashboard-content").removeAttribute("aria-busy");
}
function connectionFailure(error) {
  const auth = error.status === 401;
  const missing = error.code === "agent_missing";
  const incompatible = error.code === "protocol_mismatch";
  connectionBlocked = auth || missing || incompatible;
  const offline = navigator.onLine === false;
  const message = auth ? "Open a fresh link in Emacs with M-x overlook-remote-url. Keep this page open to retain your unsent draft."
    : incompatible ? "The app has been updated. Refresh to continue."
    : missing ? "This conversation has ended. Your unsent draft is still available on this page."
    : offline ? "You’re offline. Reconnecting when a network is available."
    : "Connection interrupted. Reconnecting…";
  const state = auth ? "auth" : incompatible ? "version" : missing ? "missing" : offline ? "offline" : "retry";
  $("conn").textContent = auth ? "Link required" : incompatible ? "Update available" : missing ? "Conversation ended" : offline ? "Offline" : "Reconnecting";
  if ($("connection").dataset.error !== state) {
    $("connection-message").textContent = message;
    $("connection").dataset.error = state;
  }
  $("connection").hidden = false;
  $("return-dashboard").hidden = !missing;
  $("reconnect").hidden = auth || missing;
  $("reconnect").textContent = incompatible ? "Refresh" : "Retry";
  $("reconnect").onclick = incompatible ? () => location.reload() : () => show();
  if (connectionBlocked) {
    const target = current() ? $("d-feed") : $("dashboard-content");
    target.querySelector(".view-state.loading")?.replaceWith(viewState(
      auth ? "Open your personal link" : incompatible ? "Update available" : "Conversation ended", message));
    target.removeAttribute("aria-busy");
  }
  return connectionBlocked;
}

function viewState(title, message, loading = false) {
  const state = el("div", "view-state" + (loading ? " loading" : ""));
  if (loading) { const spinner = el("span", "preloader"); spinner.setAttribute("aria-hidden", "true"); state.append(spinner); }
  state.append(el("h2", "", title));
  if (message) state.append(el("p", "", message));
  return state;
}

function renderLoading(id, title) {
  $(id).setAttribute("aria-busy", "true");
  $(id).replaceChildren(viewState(title, "", true));
}

function actionFailure(error, control) {
  const target = control?.closest?.(".commands, .choices, .remote-item")
    || (current() ? $("compose") : $("dashboard-content"));
  let feedback = target.querySelector?.(":scope > .operation-error");
  if (!feedback) {
    feedback = el("p", "operation-error");
    feedback.setAttribute("role", "status");
    feedback.setAttribute("aria-live", "polite");
    target.append(feedback);
  }
  feedback.textContent = error.message || "The action could not be completed. Try again.";
  return feedback;
}

function checkProtocol(data) {
  if (data.protocolVersion !== undefined && data.protocolVersion !== 2) {
    const error = new Error("Refresh this page to use the updated app");
    error.code = "protocol_mismatch";
    throw error;
  }
  return data;
}

async function call(method, path, body, signal) {
  const controller = new AbortController();
  const abort = () => controller.abort();
  signal?.addEventListener("abort", abort, {once: true});
  if (signal?.aborted) controller.abort();
  const timeout = setTimeout(abort, 40000);
  try {
    const response = await fetch("/overlook/api/" + path, {
      method,
      headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
      body: body && JSON.stringify(body),
      signal: controller.signal,
    });
    const data = checkProtocol(await response.json());
    if (!response.ok) {
      const error = new Error(data.detail || data.error || response.statusText);
      error.status = response.status;
      error.code = data.code;
      throw error;
    }
    return data;
  } catch (error) {
    if (error.name === "AbortError" && !signal?.aborted) throw new TypeError("Request timed out; retry to check delivery");
    throw error;
  } finally {
    clearTimeout(timeout);
    signal?.removeEventListener("abort", abort);
  }
}

const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

DOMPurify.addHook("afterSanitizeAttributes", (node) => {
  if (node.tagName === "A") {
    node.setAttribute("target", "_blank");
    node.setAttribute("rel", "noopener noreferrer");
  }
});

function markdown(text) {
  return DOMPurify.sanitize(marked.parse(text, { gfm: true }), { FORBID_TAGS: ["style", "form", "img"] });
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (tag === "button" && !/(?:^| )button(?: |$)/.test(className || "") && !/(?:^| )(?:link|more|unqueue|remote-row|task-check)(?: |$)/.test(className || "")) {
    node.classList.add("button", className === "primary" ? "button-fill" : "button-tonal");
    if (className === "danger") node.classList.add("color-red");
  }
  if (text) node.textContent = text;
  return node;
}

const iconPaths = {

      toast("Agent closed");
    } else if (current() === id && result.agent) {
      open(result.agent);
    }
  } catch (error) { actionFailure(error, button); }
  finally { sessionPending = false; state.pending = false; button.disabled = false; syncCompose(); }
}

function postOnClick(button, path, body) {
  button.onclick = async () => {
    button.disabled = true;
    try { await call("POST", path, body); }
    catch (error) { toast(error.message); button.disabled = false; }
  };
}

// What happens now, under the feed: the answers the agent waits for, or
// that it works, then the prompts queued for it.
const permissionResponses = new Map();
function renderLive(agent) {
  const bottom = atBottom();
  const parts = [];
  const activePermission = agent.choices.length ? JSON.stringify([agent.id, agent.choices]) : null;
  for (const signature of permissionResponses.keys()) {
    if (JSON.parse(signature)[0] === agent.id && signature !== activePermission) permissionResponses.delete(signature);
  }
  if (typeof agent.queueError === "string" && agent.queueError) {
    const failure = el("div", "item error", "Queued messages paused: " + agent.queueError);
    const retry = el("button", "", "Retry delivery");
    postOnClick(retry, "retry", { id: agent.id });
    failure.append(retry);
    parts.push(failure);
  }
  if (agent.choices.length) {
    const card = el("section", "permission-card");
    card.append(el("h3", "", "Your response is needed"), el("p", "", agent.brief || "The agent is waiting for your decision before it can continue. Review the choices below."));
    const choices = el("div", "choices");
    const feedback = el("div", "inline-feedback");
    feedback.setAttribute("role", "status");
    const signature = JSON.stringify([agent.id, agent.choices]);
    const previous = permissionResponses.get(signature);
    if (previous) { feedback.textContent = previous; choices.dataset.pending = "true"; }
    for (const choice of agent.choices) {
      const button = el("button", "", choice.label);
      button.disabled = !!previous;
      button.onclick = async () => {
        if (choices.dataset.pending) return;
        choices.dataset.pending = "true";
        for (const other of choices.children) other.disabled = true;
        feedback.textContent = "Sending response…";
        permissionResponses.set(signature, feedback.textContent);
        if (permissionResponses.size > 64) permissionResponses.delete(permissionResponses.keys().next().value);
        try {
          await call("POST", "choose", { id: agent.id, key: choice.key });
          feedback.textContent = "Response sent. Waiting for the agent…";
          permissionResponses.set(signature, feedback.textContent);
        } catch (error) {
          feedback.textContent = "Response not sent · " + error.message;
          permissionResponses.delete(signature);
          delete choices.dataset.pending;
          for (const other of choices.children) other.disabled = false;
        }
      };
      choices.append(button);
    }
    card.append(choices, feedback);
    parts.push(card);
  } else if (agent.status === "working") {
    const working = el("div", "working");
    const preloader = el("span", "preloader");
    app.preloader.init(preloader);
    working.append(preloader, el("span", "", agent.brief || "Working…"));
    parts.push(working);
  }
  for (const item of agent.queueItems || agent.queued.map(text => ({text}))) {
    const {text, id: queueId} = item;
    const node = el("div", "item prompt queued");
    const actions = el("div", "queued-actions");
    const feedback = el("div", "inline-feedback");
    feedback.setAttribute("role", "status");
    actions.append(el("small", "", "Waiting to send"));
    const withdraw = async (edit) => {
      for (const button of actions.querySelectorAll("button")) button.disabled = true;
      feedback.textContent = edit ? "Moving to draft…" : "Removing…";
      try {
        await call("POST", "unqueue", { id: agent.id, text, queueId });
        if (edit) {
          saveCompose();
          const state = draft(agent.id);
          state.text = (state.text.trim() ? state.text + "\n\n" : "") + text;
          state.revision++;
          if (composeId === agent.id) { syncCompose(); $("text").focus(); }
        }
        node.remove();
      } catch (error) {
        feedback.textContent = "Could not change queue · " + error.message;
        for (const button of actions.querySelectorAll("button")) button.disabled = false;
      }
    };
    const edit = el("button", "", "Edit"); edit.onclick = () => withdraw(true);
    const remove = el("button", "", "Remove"); remove.onclick = () => withdraw(false);
    actions.append(edit, remove);
    node.append(el("span", "", text), actions, feedback);
    parts.push(node);
  }
  $("d-live").replaceChildren(...parts);
  if (composeId === agent.id) syncCompose();
  if (bottom) scrollToBottom();
}

function diffPre(text) {
  const pre = el("pre", "diff");
  for (const line of text.split("\n")) {
    const kind = line.startsWith("@@") ? "hunk"
          : line.startsWith("+") && !line.startsWith("+++") ? "add"
          : line.startsWith("-") && !line.startsWith("---") ? "del" : "";
    pre.append(el("span", kind, line + "\n"));
  }
  return pre;
}

const toolMarks = { pending: "○", in_progress: "◐", completed: "✓", failed: "✗" };

const atBottom = () => {
  const detail = $("detail");
  return detail.scrollTop + detail.clientHeight >= detail.scrollHeight - 80;
};
function scrollToBottom() {

// A reply's markdown, drawn at most four times a second as it streams.
function renderReply(node, followScroll = true) {
  const wait = node.drawn + 250 - Date.now();
  if (wait > 0) {
    node.timer ??= setTimeout(() => { node.timer = null; renderReply(node); }, wait);
    return;
  }
  const bottom = followScroll && atBottom();
  node.drawn = Date.now();
  node.innerHTML = markdown(node.source);
  enhanceCodeBlocks(node);
  if (node.images.length) node.append(imageStrip(node.images));
  foldContent(node, node.source);
  messageTime(node);
  if (bottom) scrollToBottom();
}

// False when a reply's text does not follow on what the node holds.
function renderItem(follow, item) {
  let node = follow.nodes.get(item.item);
  const fresh = !node;
  if (fresh) {
    node = el("div");
    follow.nodes.set(item.item, node);
  }
  node.createdAt = item.createdAt || node.createdAt;
  node.itemId = item.item;
  switch (item.type) {
    case "prompt": node.className = "item prompt"; node.textContent = item.text; break;
    case "text":
      if ((node.source ?? "").length !== item.offset) return false;
      node.className = "item markdown";
      node.source = (node.source ?? "") + item.text;
      node.images = item.images;
      node.drawn ??= 0;
      renderReply(node, false);
      break;
    case "tool": renderTool(node, item); break;
    case "end": node.className = "item end"; node.textContent = "End of turn"; break;
    case "error": node.className = "item error"; node.textContent = item.text; break;
  }
  if (!["tool", "text"].includes(item.type) && item.images.length) node.append(imageStrip(item.images));
  if (item.type !== "text") {
    if (item.type !== "tool") foldContent(node, item.text);
    messageTime(node);
  }
  if (fresh) {
    let nextId = Infinity, next;
    for (const [id, candidate] of follow.nodes) {
      if (id > item.item && id < nextId) { nextId = id; next = candidate; }
    }
    if (next?.isConnected) next.before(node);
    else $("d-feed").append(node);
  }
  return true;
}

function renderItems(follow, items) {
  const regroup = items.some(item => item.type === "tool" || !follow.nodes.has(item.item));
  if (!items.every(item => renderItem(follow, item))) return false;
  if (regroup) groupCompletedTools();
  return true;
}

function formatDuration(seconds) {
  const minutes = Math.floor(seconds / 60);
  return minutes ? `${minutes}m ${Math.floor(seconds % 60)}s` : `${Math.floor(seconds)}s`;
}

function statusLabel(status) {

const dashboardDisclosures = new Map();
const usageDisclosures = new Map();
function rememberDashboardDisclosure(store, key, value) {
  if (!store.has(key) && store.size >= 256) store.delete(store.keys().next().value);
  store.set(key, value);
}
function dashboardNodes(nodes, predicate) {
  const found = new Map();
  const visit = items => { for (const node of items || []) {
    if (predicate(node)) found.set(node.agent || node.resourceId || node.id, node);
    visit(node.children);
  } };
  visit(nodes);
  return [...found.values()];
}
function dashboardCounts(node) {
  const nodes = node.children || [];
  return {
    conversations: dashboardNodes(nodes, child => child.kind === "agent" || child.kind === "saved").length,
    tasks: dashboardNodes(nodes, child => child.kind === "todo").length,
    files: dashboardNodes(nodes, child => child.kind === "file").length
  };
}
function dashboardUnit(count, unit) { return `${count} ${unit}${count === 1 ? "" : "s"}`; }
function projectAgentSummary(node) {
  const agents = dashboardNodes(node.children, child => child.kind === "agent");
  const summary = el("span", "project-agent-summary");
  for (const status of ["working", "waiting", "failed", "done"]) {

  }

}
function stableProjectNodes(nodes) {
  const compare = new Intl.Collator(undefined, {numeric: true, sensitivity: "base"}).compare;
  const projects = nodes.filter(node => node.kind === "project").sort((a, b) =>
    compare(nodeTitle(a), nodeTitle(b)) || String(a.id).localeCompare(String(b.id)));
  let index = 0;
  return nodes.map(node => node.kind === "project" ? projects[index++] : node);
}
function dashboardPersonaSection(section) {
  return section.children.some(node => node.kind === "persona" || !!node.persona);
}
function dashboardSectionRank(section) {
  if (dashboardNodes([section], node => node.kind === "project").length) return 0;
  if (dashboardPersonaSection(section)) return 1;
  if (dashboardNodes([section], node => node.kind === "usage").length) return 3;
  return 2;
}
function dashboardAttention(sections) {
  const waiting = dashboardNodes(sections, node => !!node.agent &&
    (node.attention || node.choices?.length || ["waiting", "failed"].includes(node.status)));
  if (!waiting.length) return null;
  const section = el("section", "dashboard-section dashboard-attention");
  const button = el("button", "attention-shortcut");
  button.type = "button";
  const label = el("span", "attention-caption", "Needs attention");
  label.append(el("span", "attention-detail", waiting.length === 1 ? nodeTitle(waiting[0]) : dashboardUnit(waiting.length, "conversation")));
  button.append(label, el("span", "attention-number", String(waiting.length)));
  button.setAttribute("aria-expanded", String(!!dashboardDisclosures.get("attention")));
  const list = dashboardGroup("", waiting, {key: "attention-items"});
  list.hidden = !dashboardDisclosures.get("attention");
  button.onclick = () => {
    list.hidden = !list.hidden;
    rememberDashboardDisclosure(dashboardDisclosures, "attention", !list.hidden);

  section.append(button, list);

}
function dashboardOverview(selected, persona = false) {

  const counts = dashboardCounts(selected);

function dashboardDue(value, now = new Date()) {
  if (typeof value !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return {label: "Due " + value, overdue: false};
  const [year, month, day] = value.split("-").map(Number);
  const date = new Date(year, month - 1, day);
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (date.getTime() === today.getTime()) return {label: "Due today", overdue: false};
  if (date < today) return {label: "Overdue · " + value, overdue: true};
  return {label: "Due " + value, overdue: false};
}
function usageInto(container, node) {

function personaMenu(row, box, node) {
  let timer, origin, held = false;
  const cancel = () => { clearTimeout(timer); timer = null; };
  const show = () => { cancel(); held = true; nodeActions(box, node); };
  row.addEventListener("pointerdown", event => {
    if (event.button !== 0) return;
    held = false;
    origin = {x: event.clientX, y: event.clientY};
    timer = setTimeout(show, 550);
  });
  row.addEventListener("pointermove", event => {
    if (origin && Math.hypot(event.clientX - origin.x, event.clientY - origin.y) > 8) cancel();
  });
  for (const type of ["pointerup", "pointercancel", "pointerleave"]) row.addEventListener(type, cancel);
  row.addEventListener("contextmenu", event => { event.preventDefault(); if (!held) show(); });
  row.addEventListener("keydown", event => {
    if (event.key === "ContextMenu" || event.shiftKey && event.key === "F10") {
      event.preventDefault(); show();
    }
  });
  row.addEventListener("click", event => {
    cancel();
    if (held) { held = false; event.preventDefault(); event.stopImmediatePropagation(); }
  }, true);
  row.setAttribute("aria-description", "Touch and hold or press Shift+F10 for actions");
}

// Keep the dashboard stable while a row's sheet holds input.
let panel = null;
let pendingSections = null;
const formDrafts = new Map();
function formDraftKey(nodeId, name) { return JSON.stringify([nodeId, name]); }
function forgetPanelDraft(nodeId, name) { formDrafts.delete(formDraftKey(nodeId, name)); }
function rememberPanelDraft() {
  if (!panel?.name) return;
  const key = formDraftKey(panel.node.id, panel.name);
  if (formDrafts.size >= 128 && !formDrafts.has(key)) formDrafts.delete(formDrafts.keys().next().value);
  formDrafts.set(key, {text: panel.text || "", option: panel.option});
}

function closePanel() {
  rememberPanelDraft();
  const previous = panel;
  panel = null;
  previous?.sheet.close();
  if (pendingSections) {
    const sections = pendingSections;
    pendingSections = null;
    renderDashboard(sections);
  }
}

function panelContainer(box, node, state = {}) {
  if (panel?.box === box && panel.sheet.opened) {
    panel = { ...panel, text: "", option: null, ...state };
    const container = panel.sheet.el.querySelector(".commands");
    container.replaceChildren();
    return container;
  }
  closePanel();
  const previousFocus = document.activeElement;
  const root = el("div", "sheet-modal remote-sheet");
  root.setAttribute("role", "dialog");

    swipeToClose: true, on: { opened() {

    }, closed() {

      sheet.destroy();

    } } });

function openPanel(box, node, state = {}) {
  if (state.name && !("text" in state)) {
    state = {...formDrafts.get(formDraftKey(node.id, state.name)), ...state};
  }
  const container = panelContainer(box, node, state);
  const button = (label, className, onclick) => {
    const b = el("button", className, label);
    b.onclick = (event) => { event.stopPropagation(); onclick(b); };
    return b;
  };
  const command = node.commands.find((c) => c.name === panel.name);
  panel.sheet.el.querySelector(".toolbar .title").textContent = command?.label || nodeTitle(node);
  if (!command) {
    for (const c of node.commands) {
      container.append(button(c.label, c.confirm ? "danger" : "", (b) => {
        if (c.input || c.options) openPanel(box, node, { name: c.name });
        else runCommand(node, c, {}, b);
      }));
    }
  } else if (!command.input) {
    for (const option of command.options) {
      container.append(button(option, "", (b) => runCommand(node, command, { option }, b)));
    }
  } else {
    let select = null;
    if (command.options) {
      select = el("select");
      for (const option of command.options) select.append(new Option(option, option));
      if (panel.option) select.value = panel.option;
      select.setAttribute("aria-label", "Choose " + command.label);
      select.onchange = () => { panel.option = select.value; rememberPanelDraft(); };
      container.append(select);
    }
    const text = el("textarea");
    text.placeholder = command.input;
    text.value = panel.text;
    text.setAttribute("aria-label", command.input);
    text.oninput = () => { panel.text = text.value; rememberPanelDraft(); };
    container.append(el("label", "form-label", command.input), text, button(command.label, "primary", (b) =>
      runCommand(node, command, { text: text.value, option: select?.value }, b)));
  }
  container.append(button("Cancel", "", closePanel));
  panel.sheet.el.setAttribute("aria-label", command?.label || nodeTitle(node));
  requestAnimationFrame(() => { if (panel?.sheet?.el.contains(container)) container.querySelector("textarea")?.focus(); });
}

const commandAttempts = new Map();
async function runCommand(node, command, args, button) {
  const generation = viewGeneration;
  button.disabled = true;
  button.closest?.(".commands, .remote-item")?.querySelector(".operation-error")?.remove();
  try {
    const key = JSON.stringify([node.id, command.name, args]);
    if (!commandAttempts.has(key)) {
      if (commandAttempts.size >= 128) commandAttempts.delete(commandAttempts.keys().next().value);
      commandAttempts.set(key, { node: node.id, name: command.name, requestId: randomRequestId(), ...args });
    }
    const body = commandAttempts.get(key);
    let result = await call("POST", "command", body);
    if (generation !== viewGeneration) return;
    while (result.confirm) {
      if (!await confirmAction(result.confirm, {title: nodeTitle(node), label: command.label, danger: !!command.confirm})) { commandAttempts.delete(key); button.disabled = false; return; }
      if (generation !== viewGeneration) return;
      body.confirmed = true;
      body.confirmationToken = result.confirmationToken;
      result = await call("POST", "command", body);
    }
    if (generation !== viewGeneration) return;
    commandAttempts.delete(key);
    forgetPanelDraft(node.id, command.name);
    if (panel?.node.id === node.id && panel.name === command.name) panel.name = null;
    closePanel();
    if (result.draft) appendText(draft(result.agent), result.draft);
    if (result.agent) open(result.agent);
    else toast(command.label + ": done");
  } catch (error) {
    actionFailure(error, button);
    button.disabled = false;
  }
}

function groupContents(selected) {
  const conversations = [], saved = [], tasks = [], code = [], resources = [];

// The long poll of the view shown: its url() and what it does with news(),
// which throws a Stale error when it must start over from nothing.
// With stream(), news comes as server-sent events, and long polls only
// where those fail.
let poller = null;

class Stale extends Error {}

function stopPolling() {
  poller?.controller?.abort();
  poller = null;
}

// Polls until another poller takes over or the page hides; resume() picks it up again.
async function poll(mine) {
  const controller = new AbortController();
  mine.controller = controller;
  poller = mine;
  let failures = 0;
  const current = () => poller === mine && mine.controller === controller;
  while (current() && !document.hidden) {
    try {
      if (mine.stream && mine.known) {
        await listen(mine, controller.signal, current);
        continue;
      }
      const news = await call("GET", mine.url(), undefined, controller.signal);
      if (!current()) return;
      mine.news(news);
      connected();
      failures = 0;
    } catch (error) {
      if (error instanceof Stale) continue;
      if (!current() || error.name === "AbortError") return;
      if (connectionFailure(error)) return;
      if (mine.stream && error.status) { mine.stream = null; continue; }
      await sleep(Math.min(30000, 1000 * 2 ** Math.min(failures++, 5)));
    }
  }
}

// Reads mine.stream()'s events until the connection ends or goes quiet.
async function listen(mine, signal, current) {
  const quiet = new AbortController();
  const abort = () => quiet.abort();
  signal.addEventListener("abort", abort, { once: true });
  let timer;
  const wake = () => { clearTimeout(timer); timer = setTimeout(() => quiet.abort(), 60000); };
  wake();
  try {
    const response = await fetch("/overlook/api/" + mine.stream(), {
      headers: { "Authorization": "Bearer " + token }, signal: quiet.signal,
    });
    if (!response.ok || !response.body
        || !response.headers.get("Content-Type")?.startsWith("text/event-stream")) {
      const error = new Error("no stream");
      error.status = response.status;
      throw error;
    }
    if (!current()) return;
    connected();
    const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (!current()) return;
      if (done) throw new TypeError("Stream ended");
      wake();
      buffer += value;
      let end;
      while ((end = buffer.indexOf("\n\n")) >= 0) {
        const data = buffer.slice(0, end).split("\n")
          .filter((line) => line.startsWith("data:")).map((line) => line.slice(5)).join("\n");
        buffer = buffer.slice(end + 2);
        if (data) { mine.news(checkProtocol(JSON.parse(data))); connected(); }
      }
    }
  } catch (error) {
    if (error.name === "AbortError" && !signal.aborted) throw new TypeError("Connection timed out");
    throw error;
  } finally {
    clearTimeout(timer);
    signal.removeEventListener("abort", abort);
    quiet.abort();
  }
}

function resume() {
  if (!poller || document.hidden || connectionBlocked) return;
  markSeen();
  poller.controller?.abort();
  poll(poller);
}

// Nodes a dashboard sent as { same: hash } taken from what the page has.
function expand(nodes, known) {
  return nodes.map((node) => {
    if (!node.same) return { ...node, children: expand(node.children, known) };
    if (!known.has(node.same)) throw new Stale();
    return known.get(node.same);
  });
}

function index(nodes, known = new Map()) {
  for (const node of nodes) {
    known.set(node.hash, node);
    index(node.children, known);
  }
  return known;
}

function watchDashboard() {
  if (dashboardSections.length) renderDashboard(dashboardSections);
  else renderLoading("dashboard-content", "Loading projects…");
  const mine = { known: "", nodes: new Map() };
  mine.url = () => "dashboard?known=" + mine.known;
  mine.stream = () => "dashboard/stream?known=" + mine.known;
  mine.news = (news) => {
    if (news.known === mine.known) return;
    let sections;
    try { sections = expand(news.sections, mine.nodes); }
    catch (error) {
      mine.known = "";
      mine.nodes = new Map();
      throw error;
    }
    renderDashboard(sections);
    mine.nodes = index(sections);
    mine.known = news.known;
  };
  poll(mine);
}

function renderHistoryControls(mine, error = "") {
  const controls = $("history-controls");
  controls.replaceChildren();
  controls.hidden = !mine.history?.hasMore && !error;
  if (controls.hidden) return;
  const button = el("button", "", mine.loadingHistory ? "Loading earlier messages…" : "Load earlier messages");
  button.disabled = mine.loadingHistory;
  button.onclick = () => loadEarlier(mine);
  controls.append(button);
  if (error) controls.append(el("p", "error", error));
}
async function loadEarlier(mine) {
  if (poller !== mine || mine.loadingHistory || !mine.history?.hasMore) return;
  mine.loadingHistory = true;
  renderHistoryControls(mine);
  const detail = $("detail");
  const height = detail.scrollHeight, top = detail.scrollTop;
  const revision = mine.historyRevision;
  try {
    const page = await call("GET", `history?id=${encodeURIComponent(mine.id)}&before=${mine.history.before}&limit=50&epoch=${encodeURIComponent(mine.epoch)}`);
    if (poller !== mine || revision !== mine.historyRevision) return;
    if (page.epoch !== mine.epoch) throw new Error("Earlier messages expired. Reopen this conversation to refresh.");
    const earlier = page.items.filter(item => !mine.nodes.has(item.item));
    if (!renderItems(mine, earlier)) throw new Error("Could not load earlier messages.");
    mine.history = {hasMore:page.hasMore, before:page.before};
    mine.loadingHistory = false;
    renderHistoryControls(mine);
    detail.scrollTop = top + detail.scrollHeight - height;
  } catch (error) {
    if (poller !== mine || revision !== mine.historyRevision) return;
    mine.loadingHistory = false;
    if (error.code === "history_expired") {
      mine.history = null;
      renderHistoryControls(mine, "Earlier messages have expired from the server. Reopen this conversation to refresh.");
      $("history-controls").querySelector("button").remove();
    } else renderHistoryControls(mine, error.message);
    detail.scrollTop = top;
  }
}

async function followAgent(id) {
  const mine = { id, after: 0, known: "", epoch: "", nodes: new Map(), firstNews: true, presentedSeq: 0, history: null, loadingHistory: false, historyRevision: 0 };
  mine.url = () => `events?id=${encodeURIComponent(id)}&after=${mine.after}&known=${mine.known}`
    + `&epoch=${mine.epoch}`;
  mine.news = (news) => {
    const first = mine.firstNews;
    if (news.reset || first) {
      mine.historyRevision++;
      mine.loadingHistory = false;
      mine.presentedSeq = 0;
      mine.nodes.clear();
      $("d-feed").replaceChildren();
    }
    $("d-feed").querySelector(".view-state")?.remove();
    $("d-feed").removeAttribute("aria-busy");
    const bottom = atBottom(), top = $("detail").scrollTop;
    renderHeader(news.agent);
    mine.epoch = news.epoch;
    if (news.reset || first) mine.history = news.history || null;
    if (!renderItems(mine, news.items)) {
      mine.after = 0;
      mine.nodes.clear();
      $("d-feed").replaceChildren();
      throw new Stale();
    }
    $("d-earlier").hidden = mine.nodes.size > 0 || !news.agent.reply;
    if (!mine.nodes.size && !news.agent.reply) {
      $("d-feed").replaceChildren(viewState(news.agent.status === "working" ? "Working on your request" : "Start a conversation",
        news.agent.status === "working" ? "The response will appear here." : "Send a message below to get started."));
    }
    const position = conversationPositions.get(id);
    if (first && position && !position.pinned) {
      $("detail").scrollTop = position.top;
      $("detail").dispatchEvent(new Event("scroll"));
    } else if ((first || bottom) && news.items.length) scrollToBottom();
    else $("detail").scrollTop = top;
    mine.firstNews = false;
    mine.presentedSeq = Math.max(mine.presentedSeq, ...news.items.map(item => item.seq || item.item || 0));
    renderHistoryControls(mine);
    markSeen();
    mine.after = news.seq;
    mine.known = news.known;
  };
  poller = mine;
  renderLoading("d-feed", "Loading conversation…");
  $("d-earlier").hidden = true;
  $("history-controls").hidden = true;
  try {
    const agent = await call("GET", "agent?id=" + encodeURIComponent(id));
    if (poller !== mine) return;
    connected();
    renderHeader(agent);
    $("d-reply").innerHTML = agent.reply ? markdown(agent.reply) : "";
    enhanceCodeBlocks($("d-reply"));
    foldContent($("d-reply"), agent.reply || "");
    $("d-transcript").textContent = agent.transcript;
  } catch (error) {
    if (poller !== mine) return;
    if (connectionFailure(error)) return;
  }
  if (poller === mine) poll(mine);
}

function current() {
  return new URLSearchParams(location.search).get("agent");
}

let navigationDepth = history.state?.overlookDepth || 0;
let pageTransition = null;
const conversationPositions = new Map();
const navigationFocus = new Map();
let shownRoute = location.search;
let restoringFocus = null;
function rememberNavigation() {
  if (composeId && !$("detail").hidden) {
    conversationPositions.set(composeId, {top: $("detail").scrollTop, pinned: atBottom()});
  }
  const row = document.activeElement?.closest?.("[data-node-id]");
  if (row?.dataset.nodeId) navigationFocus.set(shownRoute, row.dataset.nodeId);
}
function restoreNavigationFocus(back) {
  restoringFocus?.();
  const route = location.search;
  const nodeId = back && navigationFocus.get(route);
  const target = () => nodeId
    ? Array.from(document.querySelectorAll("[data-node-id]")).find(node => node.dataset.nodeId === nodeId)?.querySelector(".remote-row")
    : current() || new URLSearchParams(route).has("node") ? $("heading") : $("dashboard-intro").querySelector("h1");
  const focus = () => {
    const element = target();
    if (!element || element.closest("[hidden]") || element.closest(".page-snapshot")) return false;
    if (!element.matches("button, a, input, textarea, select")) element.tabIndex = -1;
    element.focus({preventScroll: true});
    return true;
  };
  if (focus()) return;
  const observer = new MutationObserver(() => { if (focus()) cleanup(); });
  observer.observe($("dashboard-content"), {childList: true, subtree: true});
  const timer = setTimeout(() => { cleanup(); $("heading").focus({preventScroll: true}); }, 4000);
  function cleanup() { observer.disconnect(); clearTimeout(timer); restoringFocus = null; }
  restoringFocus = cleanup;
}
function transitionPage(update, back = false) {
  rememberNavigation();
  const render = update;
  update = () => { render(); shownRoute = location.search; requestAnimationFrame(() => restoreNavigationFocus(back)); };
  pageTransition?.();
  if (window.matchMedia?.("(prefers-reduced-motion: reduce)").matches) { update(); return; }
  const page = document.querySelector(".remote-page");
  if (!page?.animate) { update(); return; }
  const snapshot = page.cloneNode(true);
  snapshot.classList.add("page-snapshot");
  snapshot.inert = true;
  snapshot.setAttribute("aria-hidden", "true");
  snapshot.querySelectorAll("[id]").forEach((node) => {
    node.dataset.snapshotId = node.id;
    node.removeAttribute("id");
  });
  update();
  page.parentElement.append(snapshot);
  const timing = { duration: 340, easing: "cubic-bezier(.32,.72,0,1)", fill: "both" };
  const outgoing = snapshot.animate([{ transform: "translateX(0)", opacity: 1 },
    { transform: back ? "translateX(100%)" : "translateX(-25%)", opacity: back ? 1 : .7 }], timing);
  const incoming = page.animate([{ transform: back ? "translateX(-25%)" : "translateX(100%)" },
    { transform: "translateX(0)" }], timing);
  snapshot.style.zIndex = back ? "20" : "0";
  page.style.zIndex = back ? "0" : "1";
  const cleanup = () => { outgoing.cancel(); incoming.cancel(); snapshot.remove(); page.style.zIndex = ""; };
  pageTransition = cleanup;
  incoming.finished.then(() => { if (pageTransition === cleanup) { cleanup(); pageTransition = null; } }, () => {});
}

function navigate(search, back = false, replace = false) {
  const depth = replace ? Math.max(0, navigationDepth - 1) : navigationDepth + 1;
  const query = search.toString();
  history[replace ? "replaceState" : "pushState"]({ overlookDepth: depth }, "",
    location.pathname + (query ? "?" + query : "") + location.hash);
  navigationDepth = depth;
  transitionPage(show, back);
}

function open(id) {
  const search = new URLSearchParams(location.search);
  search.set("agent", id);
  navigate(search);
}

function openGroup(id) {
  navigate(new URLSearchParams({ node: id }));
}

function goBack() {
  if (navigationDepth > 0) { history.back(); return; }
  const search = new URLSearchParams(location.search);
  if (current()) search.delete("agent");
  else {
    const path = dashboardPath(search.get("node"));
    if (path?.length > 2) search.set("node", path.at(-2).id);
    else search.delete("node");
  }
  navigate(search, true, true);
}

function show() {
  if (dashboardRoute !== null && !$("dash").hidden) dashboardScroll.set(dashboardRoute, $("dash").scrollTop);
  viewGeneration++;
  connectionBlocked = false;
  $("connection").hidden = true;
  saveCompose();
  const id = current();
  if (composeId !== id) composing = false;
  composeId = id;
  $("dash").hidden = !!id;
  $("detail").hidden = !id;
  $("latest").hidden = true;
  $("compose").hidden = !id;
  if (id) syncCompose();
  $("back").hidden = !id && !new URLSearchParams(location.search).has("node");
  document.querySelector(".remote-page").classList.toggle("home", !id && !new URLSearchParams(location.search).has("node"));
  stopPolling();
  shownHeader = "";
  agentControls = {};
  $("steer").hidden = $("session-menu").hidden = true;
  $("context").hidden = true;
  $("persona-profile").hidden = true;
  renderSlashCommands();
  pendingSections = null;
  closePanel();
  app.actions.close();
  app.dialog.close();
  photoBrowser?.close();
  if (!token) {
    const target = id ? $("d-feed") : $("dashboard-content");
    target.replaceChildren(viewState("Open your personal link", "In Emacs, run M-x overlook-remote-url and open the generated link on this device."));
    $("compose").hidden = true;
    $("heading").textContent = "Overlook";
    return;
  }
  if (id) {
    shownAgent = null;
    $("heading").replaceChildren(el("span", "navigation-title", "Conversation"), el("span", "navigation-subtitle", "Loading…"));
    followAgent(id);
  }
  else {
    $("heading").textContent = "Overlook";
    dashboardRoute = new URLSearchParams(location.search).get("node") || "";
    pendingDashboardScroll = dashboardScroll.get(dashboardRoute) || 0;
    watchDashboard();
  }
}

$("reconnect").onclick = () => show();
$("return-dashboard").onclick = () => navigate(new URLSearchParams(), true);
window.addEventListener("online", () => { if (!connectionBlocked) resume(); });
window.addEventListener("offline", () => connectionFailure(new TypeError("offline")));
$("back").onclick = goBack;
window.onpopstate = (event) => {
  const depth = event.state?.overlookDepth || 0;
  const back = depth < navigationDepth;
  navigationDepth = depth;
  transitionPage(show, back);
};
document.addEventListener("visibilitychange", resume);

function finishComposition() {
  composing = false;
  if (composeId) {
    const state = draft(composeId);
    state.text = $("text").value;
    state.revision++;
    for (const text of state.pendingAttachments) appendText(state, text);
    state.pendingAttachments = [];
    syncCompose();
  }
}
$("text").addEventListener("compositionstart", () => {
  composing = true;
  if (composeId) draft(composeId).revision++;
});
$("text").addEventListener("compositionend", finishComposition);
$("text").addEventListener("blur", () => { if (composing) finishComposition(); });
$("text").addEventListener("keydown", (event) => {
  if (event.key !== "Enter" || !(event.metaKey || event.ctrlKey) || event.isComposing || composing) return;
  event.preventDefault();
  $("send").click();
});
$("text").addEventListener("input", (event) => {
  if (composeId) {
    draft(composeId).text = event.target.value;
    draft(composeId).revision++;
  }
  if (event.isComposing || composing) return;
  syncCompose();
});

const sendable = ["image/png", "image/jpeg", "image/gif", "image/webp"];

async function prepare(file) {
  if (sendable.includes(file.type) && file.size <= 2500000) return file;
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, 2000 / Math.max(bitmap.width, bitmap.height));
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(bitmap.width * scale);
  canvas.height = Math.round(bitmap.height * scale);
  canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  return new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.85));
}

function base64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.slice(reader.result.indexOf(",") + 1));
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(blob);
  });
}

async function uploadAttachment(preview, state, id) {
  if (preview.uploading || preview.removed || state.pending) return;
  preview.uploading = true;
  preview.uploadError = "";
  state.uploading++;
  if (composeId === id) syncCompose();
  try {
    const blob = await prepare(preview.file);
    if (!blob) throw new Error("This image could not be prepared");
    const { text } = await call("POST", "upload", { id, mime: blob.type, data: await base64(blob) });
    if (!text || typeof text !== "string") throw new Error("No attachment was returned");
    if (preview.removed) return;
    saveCompose();
    preview.attachmentText = text;
    if (composing && composeId === id) state.pendingAttachments.push(text);
    else appendText(state, text);
    state.revision++;
  } catch (error) {
    if (!preview.removed) preview.uploadError = error.message;
  } finally {
    preview.uploading = false;
    state.uploading--;
    if (composeId === id) syncCompose();
  }
}

async function attach(file) {
  saveCompose();
  const id = current();
  if (!id) return;
  const state = draft(id);
  if (state.pending) return;
  const preview = el("img");
  preview.src = URL.createObjectURL(file);
  preview.alt = file.name || "Attachment";
  preview.file = file;
  state.previews.push(preview);
  state.revision++;
  await uploadAttachment(preview, state, id);
}

$("attach").onclick = () => $("files").click();
$("files").onchange = (event) => {
  [...event.target.files].forEach(attach);
  event.target.value = "";
};

$("send").onclick = async () => {
  saveCompose();
  const id = current();
  const state = draft(id);
  const text = state.text.trim();
  if (!text || composing || state.pending || state.uploading || state.previews.some(preview => preview.uploadError)) return;
  const revision = state.revision;
  state.pending = true;
  state.sendError = "";
  syncCompose();
  try {
    const { queued } = await call("POST", "prompt", { id, text,
      requestId: requestId(state, "send", text) });
    saveCompose();
    acknowledge(id, state, revision, text);
    state.sendError = "";
    toast(queued ? "Message queued" : "Sent");
  } catch (error) {
    state.sendError = error.message;
  } finally {
    state.pending = false;
    if (composeId === id) syncCompose();
  }
};

$("steer").onclick = () => sessionAction("steer", $("steer"));

show();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="overlook">
<meta name="color-scheme" content="light dark">
<title>overlook</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1d1d1f; --dim: #6e6e73; --line: #e5e5ea; --card: #f5f5f7;
    --accent: #0a66d8; --working: #b07d00; --waiting: #d1242f; --failed: #d1242f;
    --done: #1a7f37; --idle: #8e8e93; --wait-bg: #fbe4e4; --done-bg: #e2f5e6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --fg: #f2f2f7; --dim: #98989d; --line: #2c2c2e; --card: #1c1c1e;
      --accent: #4c9bff; --wait-bg: #3d1c20; --done-bg: #1b3324;
    }
  }
  * { box-sizing: border-box; }
  html { height: 100%; overflow: hidden; }
  body {
    position: fixed; top: 0; left: 0; right: 0; height: 100dvh; margin: 0; overflow: hidden;
    display: flex; flex-direction: column; background: var(--bg); color: var(--fg);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    padding-top: env(safe-area-inset-top);
  }
  header {
    position: relative; flex: none; z-index: 1; background: var(--bg);
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 17px; margin: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header button { font-size: 17px; background: none; border: 0; color: var(--accent); padding: 4px 0; }
  #conn { font-size: 12px; color: var(--dim); }
  #connection { flex: none; padding: 10px 14px; background: var(--card); border-bottom: 1px solid var(--line); font-size: 13px; }
  #connection button { margin-left: 10px; color: var(--accent); }
  #context { flex: none; font-size: 12px; color: var(--dim); white-space: nowrap; }
  .icon { display: inline-block; width: 18px; height: 18px; vertical-align: -3px; object-fit: contain; }
  #heading .icon { margin-right: 6px; }
  #context .icon { width: 15px; height: 15px; margin-right: 4px; }
  main {
    flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    padding: 8px 12px calc(16px + env(safe-area-inset-bottom));
  }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--dim); margin: 18px 4px 6px; }
  .card {
    background: var(--card); border-radius: 12px; padding: 10px 12px; margin: 6px 0;
    border-left: 4px solid var(--idle);
  }
  .card.working { border-left-color: var(--working); }
  .card.waiting { border-left-color: var(--waiting); background: var(--wait-bg); }
  .card.failed  { border-left-color: var(--failed); }
  .card.done    { border-left-color: var(--done); background: var(--done-bg); }
  .row { display: flex; gap: 6px; align-items: baseline; }
  .name { font-weight: 600; }
  .meta { color: var(--dim); font-size: 13px; }
  .status { margin-left: auto; font-size: 12px; color: var(--dim); }
  .brief { margin-top: 4px; font-size: 14px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .choices { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .choices button, .commands button {
    font-size: 15px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--fg); max-width: 100%; text-align: left;
  }
  .choices button b { color: var(--accent); margin-right: 4px; }
  pre {
    white-space: pre-wrap; word-break: break-word; font: 13px/1.45 ui-monospace, Menlo, monospace;
    background: var(--card); border-radius: 10px; padding: 10px; margin: 6px 0;
  }
  .md { background: var(--card); border-radius: 10px; padding: 2px 12px; margin: 6px 0; font-size: 15px; overflow-wrap: anywhere; }
  .md h1, .md h2, .md h3, .md h4 { font-size: 16px; text-transform: none; letter-spacing: 0; color: var(--fg); margin: 14px 0 6px; }
  .md p, .md ul, .md ol, .md blockquote { margin: 8px 0; }
  .md ul, .md ol { padding-left: 22px; }
  .md li { margin: 2px 0; }
  .md code { font: 13px ui-monospace, Menlo, monospace; background: var(--bg); border-radius: 4px; padding: 1px 4px; }
  .md pre { background: var(--bg); overflow-x: auto; white-space: pre; word-break: normal; }
  .md pre code { padding: 0; }
  .md table { display: block; overflow-x: auto; border-collapse: collapse; font-size: 14px; margin: 8px 0; }
  .md th, .md td { border: 1px solid var(--line); padding: 4px 8px; vertical-align: top; min-width: 4em; }
  .md th { background: var(--bg); text-align: left; }
  .md blockquote { border-left: 3px solid var(--line); padding-left: 10px; color: var(--dim); }
  .md a { color: var(--accent); }
  .md hr { border: 0; border-top: 1px solid var(--line); }
  details summary { color: var(--dim); font-size: 14px; padding: 8px 4px; }
  footer {
    position: relative; flex: none; z-index: 3; background: var(--bg);
    border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: flex-end;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
  }
  footer textarea {
    flex: 1; min-width: 0; min-height: 44px; font: inherit; font-size: 16px; line-height: 22px; resize: none; height: 44px;
    overflow-y: hidden;
    border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--card); color: var(--fg);
  }
  footer button {
    font-size: 16px; border: 0; border-radius: 10px; padding: 0 10px;
    background: var(--accent); color: #fff;
  }
  footer button:disabled { opacity: .5; }
  #attach, #send, #steer { flex: none; height: 44px; white-space: nowrap; }
  #toast {
    position: absolute; left: 12px; right: 12px; bottom: 80px; padding: 10px 12px; border-radius: 10px;
    background: #333; color: #fff; font-size: 14px; display: none;
  }
  .empty { color: var(--dim); text-align: center; margin-top: 40px; }
  #d-live .choices { margin: 10px 0; }
  .working { display: flex; align-items: center; gap: 5px; margin: 14px 4px; color: var(--dim); font-size: 13px; min-width: 0; }
  .working i { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--working); animation: pulse 1.2s infinite ease-in-out both; }
  .working i:nth-child(2) { animation-delay: .15s; }
  .working i:nth-child(3) { animation-delay: .3s; }
  .working span { margin-left: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @keyframes pulse { 0%, 80%, 100% { opacity: .25; transform: scale(.75); } 40% { opacity: 1; transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .working i { animation: none; opacity: .6; } }
  .prompt.queued { opacity: .6; display: flex; gap: 8px; align-items: baseline; }
  .prompt.queued span { flex: 1; }
  .prompt.queued small { flex: none; font-size: 12px; }
  .unqueue { flex: none; border: 0; background: none; color: #fff; font-size: 15px; padding: 0 2px; }
  .item { margin: 10px 0; }
  .prompt {
    margin-left: 15%; padding: 8px 12px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere;
    background: var(--accent); color: #fff; font-size: 15px;
  }
  .tool { font-size: 13px; color: var(--dim); }
  .tool-head { display: flex; gap: 6px; align-items: baseline; }
  .tool-head span:nth-child(2) { color: var(--fg); overflow-wrap: anywhere; }
  .tool-head .meta { margin-left: auto; white-space: nowrap; }
  .tool.failed .tool-mark { color: var(--failed); }
  .tool.completed .tool-mark { color: var(--done); }
  .tool.pending .tool-mark, .tool.in_progress .tool-mark { color: var(--working); }
  .tool details summary { padding: 4px 0 0 18px; font-size: 13px; }
  pre.diff { white-space: pre; overflow-x: auto; word-break: normal; font-size: 12px; }
  .diff .add { color: var(--done); }
  .diff .del { color: var(--failed); }
  .diff .hunk { color: var(--accent); }
  .end { text-align: center; color: var(--dim); font-size: 12px; border-top: 1px solid var(--line); padding-top: 4px; }
  .error { color: var(--failed); font-size: 14px; }
  .images { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .images img {
    max-height: 140px; max-width: 45%; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); cursor: zoom-in;
  }
  .images img.full { max-height: none; max-width: 100%; cursor: zoom-out; }
  .prompt .images img { border-color: rgba(255,255,255,.4); }
  footer { flex-wrap: wrap; }
  #previews { width: 100%; margin-top: 0; }
  #previews:empty { display: none; }
  #previews img { max-height: 64px; cursor: default; }
  #attach {
    font-size: 22px; border: 0; background: none; color: var(--accent); padding: 0 4px;
  }
  #switch { margin-left: 4px; font-size: 15px; }
  #session-menu { position: relative; flex: none; }
  #session-menu > summary { list-style: none; cursor: pointer; color: var(--accent); font-size: 24px; line-height: 24px; padding: 4px 8px; }
  #session-menu > summary::-webkit-details-marker { display: none; }
  #session-actions { position: absolute; right: 0; top: calc(100% + 8px); min-width: 190px; padding: 4px; display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 4px 16px #0002; }
  #session-actions button { padding: 12px; text-align: left; white-space: nowrap; font-size: 15px; border-radius: 6px; }
  #session-actions button:active { background: var(--bg); }
  #slash-commands { position: absolute; bottom: 100%; left: 0; right: 0; max-height: 35vh; overflow-y: auto; padding: 4px 12px; background: var(--bg); border-top: 1px solid var(--line); }
  #slash-commands .command-group { padding: 8px 10px 4px; color: var(--dim); font-size: 12px; }
  #slash-commands button { display: block; width: 100%; margin: 0; padding: 8px 10px; border-radius: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--fg); text-align: left; font: inherit; }
  #slash-commands button:active { background: var(--card); }
  #slash-commands .command-name { display: block; font-weight: 600; overflow-wrap: anywhere; }
  #slash-commands .command-description { display: block; margin-top: 2px; color: var(--dim); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #slash-commands:empty { display: none; }
  #dash { padding: 4px 10px 40px; }
  .section { margin: 10px 0 14px; }
  .section > .line { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--dim); padding: 6px 4px; }
  .section > .line .s-section { color: var(--dim); font-weight: 600; }
  .node > .children { margin-left: 10px; padding-left: 8px; border-left: 1px solid var(--line); }
  .section > .children { margin-left: 0; padding-left: 0; border-left: 0; }
  .node.folded > .children { display: none; }
  .line {
    display: flex; gap: 6px; align-items: baseline; padding: 4px 6px; border-radius: 8px;
    font-size: 15px; overflow-wrap: anywhere;
  }
  .line .twist { flex: none; width: 12px; color: var(--dim); font-size: 11px; }
  .line .text { flex: 1; min-width: 0; white-space: pre-line; }
  .line .right { flex: none; display: flex; gap: 1ch; white-space: nowrap; color: var(--dim); font-size: 13px; }
  .line:has(.s-tabular) { font: 13px/1.5 ui-monospace, Menlo, monospace; }
  .s-tabular { white-space: pre; }
  .line .pad { display: inline-block; flex: none; }
  .line .pad .icon { width: 2ch; }
  .line .text:has(> .wrap), .line .text:has(> .fit) { display: flex; align-items: baseline; }
  .line .text:has(> .fit) > * { flex: none; white-space: pre; }
  .line .text > .fit { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .line.agent .text { display: flex; flex-wrap: wrap; align-items: baseline; overflow: hidden; }
  .line.agent .text > * { min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .line.agent .text > span:has(> .icon) { flex: none; margin-inline: 6px; }
  .line.agent .text > .fit { flex: 1 1 100%; }
  .line.agent .right { align-self: flex-start; }
  .line .lead { flex: none; }
  .line .wrap { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; }
  .line .wrap .piece:has(> .meter), .line .wrap .piece.metric { flex: 1 1 24ch; display: flex; align-items: baseline; white-space: pre; }
  .line .wrap .metric-gap { flex: 1; }
  .line .wrap .meter { min-width: 0; height: 2px; align-self: center; background: currentColor; font-size: 0; }
  .line.link { cursor: pointer; }
  .line.heading .text { font-weight: 600; }
  .line.attention { box-shadow: inset 3px 0 var(--waiting); background: var(--wait-bg); }
  .line:has(.s-done) { box-shadow: inset 3px 0 var(--done); background: var(--done-bg); }
  .line:has(.s-waiting) { box-shadow: inset 3px 0 var(--waiting); background: var(--wait-bg); }
  .line.agent .text::after { content: " ›"; color: var(--dim); }
  .node > .choices { margin: 2px 0 6px 24px; }
  .line .more { flex: none; border: 0; background: none; color: var(--dim); font-size: 17px; padding: 0 4px; line-height: 1; }
  .node > .commands { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 8px 24px; }
  .commands .danger { color: var(--failed); }
  .commands .primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .commands textarea, .commands select {
    width: 100%; font: inherit; font-size: 16px; border: 1px solid var(--line); border-radius: 8px;
    padding: 8px; background: var(--card); color: var(--fg);
  }
  .commands textarea { min-height: 64px; resize: vertical; }
  .s-dim { color: var(--dim); }
  .s-warning { color: var(--working); }
  .s-error { color: var(--failed); }
  .s-success, .s-string { color: var(--done); }
  .s-bold { font-weight: 600; }
  .s-italic { font-style: italic; }
  .s-accent { color: var(--accent); }
  .s-name { color: #8a3ffc; }
  .s-track { opacity: .3; }
  .s-key { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  [hidden] { display: none !important; }
</style>
</head>

<header>
  <button id="back" hidden>‹ Back</button>
  <h1 id="heading">overlook</h1>
  <span id="conn"></span>
  <span id="context" hidden title="Context window used"></span>
  <button id="switch"></button>
  <details id="session-menu" hidden>
    <summary aria-label="Session menu" title="Session menu">⋯</summary>
    <div id="session-actions"></div>
  </details>
</header>
<div id="connection" role="status" hidden>
  <span id="connection-message"></span>
  <button id="reconnect">Reconnect</button>
  <button id="return-dashboard" hidden>Dashboard</button>
</div>
<main id="dash"></main>
<main id="list" hidden></main>
<main id="detail" hidden>
  <div id="d-earlier" hidden>
    <h2>Last reply</h2>
    <div id="d-reply" class="md"></div>
    <details>
      <summary>Transcript (end)</summary>
      <pre id="d-transcript"></pre>
    </details>
  </div>
  <div id="d-feed"></div>
  <div id="d-live"></div>
</main>
<footer id="compose" hidden>
  <div id="slash-commands" aria-label="Available slash commands"></div>
  <div id="previews" class="images"></div>
  <button id="attach" title="Attach images">＋</button>
  <input id="files" type="file" accept="image/*" multiple hidden>
  <textarea id="text" placeholder="Prompt this agent" rows="1"></textarea>
  <button id="steer" hidden title="Steer the running turn, or start a new turn when idle">Steer</button>
  <button id="send">Send</button>
</footer>
<div id="toast"></div>
<script src="/overlook/vendor/marked.js"></script>
<script src="/overlook/vendor/purify.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const order = { waiting: 0, failed: 1, done: 2, working: 3, idle: 4 };

if (location.hash.length > 1) {
  localStorage.setItem("overlook-token", location.hash.slice(1));
}
const token = localStorage.getItem("overlook-token");
// Home Screen apps have their own storage; keep the credential in their launch URL.
if (token && !location.hash) {
  history.replaceState(null, "", location.pathname + location.search + "#" + token);
}

function toast(message) {
  const el = $("toast");
  el.textContent = message;
  el.style.display = "block";
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { el.style.display = "none"; }, 4000);
}

let lastSync = null;
let connectionBlocked = false;
let viewGeneration = 0;
function connected() {
  lastSync = new Date();
  connectionBlocked = false;
  $("conn").textContent = lastSync.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
  $("conn").title = "Last synced: " + lastSync.toLocaleString();
  $("connection").hidden = true;
}
function connectionFailure(error) {
  const auth = error.status === 401;
  const missing = error.code === "agent_missing";
  connectionBlocked = auth || missing;
  const message = auth ? "Credential expired. Open a fresh link from Emacs: M-x overlook-remote-url."
    : missing ? "This session no longer exists. Return to the dashboard to choose a session."
    : "Connection lost. Reconnecting…";
  $("conn").textContent = auth ? "Sign in" : missing ? "Session gone" : "Reconnecting";
  $("connection-message").textContent = message + (lastSync ? " Last synced: " + lastSync.toLocaleTimeString() : " No successful sync yet.");
  $("connection").hidden = false;
  $("return-dashboard").hidden = !missing;
  return connectionBlocked;
}

async function call(method, path, body, signal) {
  const controller = new AbortController();
  const abort = () => controller.abort();
  signal?.addEventListener("abort", abort, {once: true});
  if (signal?.aborted) controller.abort();
  const timeout = setTimeout(abort, 40000);
  try {
    const response = await fetch("/overlook/api/" + path, {
      method,
      headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
      body: body && JSON.stringify(body),
      signal: controller.signal,
    });
    const data = await response.json();
    if (!response.ok) {
      const error = new Error(data.error || response.statusText);
      error.status = response.status;
      error.code = data.code;
      throw error;
    }
    return data;
  } catch (error) {
    if (error.name === "AbortError" && !signal?.aborted) throw new TypeError("Request timed out; retry to check delivery");
    throw error;
  } finally {
    clearTimeout(timeout);
    signal?.removeEventListener("abort", abort);
  }
}

const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

DOMPurify.addHook("afterSanitizeAttributes", (node) => {
  if (node.tagName === "A") {
    node.setAttribute("target", "_blank");
    node.setAttribute("rel", "noopener noreferrer");
  }
});

function markdown(text) {
  return DOMPurify.sanitize(marked.parse(text, { gfm: true }), { FORBID_TAGS: ["style", "form", "img"] });
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text) node.textContent = text;
  return node;
}

const iconPath = (name) => iconPaths[String(name).toLowerCase()];

function icon(name, title = name) {
  const path = iconPath(name);
  if (!path) return el("span", "", name);
  const image = el("img", "icon");
  image.src = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">' + path + '</svg>');
  image.alt = name;
  image.title = title;
  return image;
}

const imageUrls = new Map();

function imageUrl(n) {
  if (!imageUrls.has(n)) {
    imageUrls.set(n, fetch("/overlook/api/image?n=" + n, { headers: { "Authorization": "Bearer " + token } })
      .then((response) => response.ok ? response.blob() : Promise.reject(new Error("image " + n)))
      .then((blob) => URL.createObjectURL(blob))
      .catch((error) => { imageUrls.delete(n); throw error; }));
  }
  return imageUrls.get(n);
}

function zoomable(img) {
  img.onclick = (event) => { event.stopPropagation(); img.classList.toggle("full"); };
  return img;
}

function imageStrip(numbers) {
  const strip = el("div", "images");
  for (const n of numbers) {
    const img = zoomable(el("img"));
    img.alt = "image " + n;
    imageUrl(n).then((url) => { img.src = url; }, () => img.remove());
    strip.append(img);
  }
  return strip;
}

function choiceButtons(agent, container) {
  container.replaceChildren(...agent.choices.map((choice) => {
    const button = el("button");
    button.append(el("b", "", choice.key), choice.label);
    button.onclick = async (event) => {
      event.stopPropagation();
      button.disabled = true;
      try { await call("POST", "choose", { id: agent.id, key: choice.key }); if (view() === "agents") refresh(); }
      catch (error) { toast(error.message); button.disabled = false; }
    };
    return button;
  }));
}

function card(agent) {
  const node = el("div", "card " + agent.status);
  const row = el("div", "row");
  const name = el("span", "name");
  name.append(icon(agent.agent), agent.title ? " · " + agent.title : "");
  row.append(name,
             el("span", "meta", agent.project),
             el("span", "status", agent.status));
  node.append(row);
  if (agent.brief) node.append(el("div", "brief", agent.brief));
  if (agent.choices.length) {
    const choices = el("div", "choices");
    choiceButtons(agent, choices);
    node.append(choices);
  }
  node.onclick = () => open(agent.id);
  return node;
}

let shownList = "";
function renderList(agents) {
  const key = JSON.stringify(agents);
  if (key === shownList) return;
  shownList = key;
  const list = $("list");
  if (!agents.length) {
    list.replaceChildren(el("p", "empty", "No agents running."));
    return;
  }
  const attention = agents.filter((a) => order[a.status] < 2)
    .sort((a, b) => order[a.status] - order[b.status]);
  const groups = new Map();
  for (const agent of agents) {
    if (order[agent.status] < 2) continue;
    const name = agent.perspective || "(no perspective)";
    if (!groups.has(name)) groups.set(name, []);
    groups.get(name).push(agent);
  }
  const nodes = [];
  if (attention.length) nodes.push(el("h2", "", "Waiting for you"), ...attention.map(card));
  for (const [name, members] of groups) {
    members.sort((a, b) => order[a.status] - order[b.status]);
    nodes.push(el("h2", "", name), ...members.map(card));
  }
  list.replaceChildren(...nodes);
}

let shownHeader = "";
let agentControls = {};
function renderHeader(agent) {
  const key = JSON.stringify(agent);
  if (key === shownHeader) return;
  shownHeader = key;
  $("heading").replaceChildren(icon(agent.agent), agent.title || "");
  $("context").hidden = !Number.isFinite(agent.context);
  $("context").replaceChildren(...(Number.isFinite(agent.context)
    ? [icon("context", "Context window used"), `${Math.round(agent.context)}%`] : []));
  agentControls = agent.controls || {};
  $("steer").hidden = !agentControls.steer;
  const actions = agentControls.actions || [];
  $("session-menu").hidden = !actions.length;
  $("session-actions").replaceChildren(...actions.map((action) => {
    const labels = { stop: "Stop current task", reload: "Reload", restart: "New conversation", fork: "Fork" };
    const item = el("button", "", labels[action] || action);
    item.onclick = () => sessionAction(action, item);
    return item;
  }));
  renderSlashCommands();
  renderLive(agent);
}

function renderSlashCommands() {
  if (composing) return;
  const text = $("text").value;
  const commands = text.startsWith("/") && !/\s/.test(text)
    ? (agentControls.slash || []).filter((command) =>
      command.name.replace(/^\$/, "").startsWith(text.slice(1).replace(/^\$/, ""))) : [];
  const rows = [];
  for (const skill of [false, true]) {
    const group = commands.filter((command) => command.name.startsWith("$") === skill);
    if (!group.length) continue;
    rows.push(el("div", "command-group", skill ? "Skills" : "Commands"));
    for (const command of group) {
      const item = el("button");
      item.append(el("span", "command-name", skill ? command.name.slice(1) : "/" + command.name));
      if (command.description) item.append(el("span", "command-description", command.description));
      item.title = command.description;
      item.onclick = () => {
        $("text").value = "/" + command.name + " ";
        $("text").dispatchEvent(new Event("input"));
        $("text").focus();
      };
      rows.push(item);
    }
  }
  $("slash-commands").replaceChildren(...rows);
}

const drafts = new Map();
let composeId = null;
let composing = false;
function draft(id) {
  if (!drafts.has(id)) drafts.set(id, { text: "", revision: 0, previews: [], uploading: 0, pending: false, attempts: new Map(), pendingAttachments: [] });
  return drafts.get(id);
}
function saveCompose() {
  if (composeId) draft(composeId).text = $("text").value;
}
// iOS never resizes the layout for the keyboard, so the page itself stays still and fits the
// visual viewport; only the content inside it scrolls.
function fitShell() {
  const viewport = window.visualViewport;
  if (!viewport || viewport.scale > 1) return;
  document.body.style.height = viewport.height + "px";
  document.body.style.top = Math.max(0, viewport.offsetTop) + "px";
}
const keyboardOpen = () => {
  const viewport = window.visualViewport;
  return !!viewport && !(viewport.scale > 1) && innerHeight - viewport.height >= 1;
};
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", fitShell);
  window.visualViewport.addEventListener("scroll", fitShell);
}
fitShell();
// With the keyboard up iOS pans the page on any drag that nothing inside can absorb.
document.addEventListener("touchmove", (event) => {
  if (!keyboardOpen()) return;
  const scroller = event.target.closest?.("main, textarea, #slash-commands");
  if (!scroller || scroller.scrollHeight <= scroller.clientHeight) event.preventDefault();
}, {passive: false});
function resizeCompose() {
  if (!composing) {
    const box = $("text");
    box.style.height = "44px";
    const height = Math.max(44, box.scrollHeight + 2);
    const limit = Math.max(44, (window.visualViewport?.height || innerHeight) * 0.4);
    box.style.maxHeight = limit + "px";
    box.style.height = height + "px";
    box.style.overflowY = height > limit ? "auto" : "hidden";
  }
}
function syncCompose() {
  if (!composeId) return;
  const state = draft(composeId);
  if (!composing && $("text").value !== state.text) $("text").value = state.text;
  $("previews").replaceChildren(...state.previews);
  resizeCompose();
  $("send").disabled = $("steer").disabled = state.pending || state.uploading > 0;
  renderSlashCommands();
}
function appendText(state, text) {
  state.text = (state.text.trim() ? state.text.replace(/\s*$/, " ") : "") + text + " ";
}
function requestId(state, action, text) {
  const key = JSON.stringify([action, text]);
  if (!state.attempts.has(key)) state.attempts.set(key,
    Array.from(crypto.getRandomValues(new Uint8Array(16)), n => n.toString(16).padStart(2, "0")).join(""));
  return state.attempts.get(key);
}
function acknowledge(id, state, revision, text) {
  state.attempts.clear();
  if (state.revision === revision && state.text.trim() === text) {
    state.text = "";
    state.previews.forEach(node => URL.revokeObjectURL(node.src));
    state.previews = [];
  }
  if (composeId === id) syncCompose();
}
let sessionPending = false;
async function sessionAction(action, button) {
  if (sessionPending) return;
  saveCompose();
  const id = current();
  const state = draft(id);
  if (state.pending || state.uploading) return;
  const revision = state.revision;
  const text = action === "steer" ? state.text.trim() : "";
  if (action === "steer" && (!text || composing)) return;
  sessionPending = true;
  state.pending = true;
  syncCompose();
  button.disabled = true;
  try {
    const body = { id, action, text, confirmations: [],
      requestId: requestId(state, action, text) };
    let result;
    for (;;) {
      result = await call("POST", "session", body);
      if (!result.confirm) break;
      if (!confirm(result.confirm)) return;
      body.confirmations.push(result.confirm);
    }
    state.attempts.clear();
    if (action === "steer") {
      saveCompose();
      acknowledge(id, state, revision, text);
      toast("Steer sent");
    } else if (action === "stop") {
      toast("Stop requested");
    } else if (current() === id) {
      $("session-menu").open = false;
      open(result.agent);
    }
  } catch (error) { toast(error.message); }
  finally { sessionPending = false; state.pending = false; button.disabled = false; syncCompose(); }
}

function postOnClick(button, path, body) {
  button.onclick = async () => {
    button.disabled = true;
    try { await call("POST", path, body); }
    catch (error) { toast(error.message); button.disabled = false; }
  };
}

// What happens now, under the feed: the answers the agent waits for, or
// that it works, then the prompts queued for it.
function renderLive(agent) {
  const bottom = atBottom();
  const parts = [];
  if (typeof agent.queueError === "string" && agent.queueError) {
    const failure = el("div", "item error", "Not sent: " + agent.queueError);
    const retry = el("button", "", "Retry");
    postOnClick(retry, "retry", { id: agent.id });
    failure.append(retry);
    parts.push(failure);
  }
  if (agent.choices.length) {
    const choices = el("div", "choices");
    choiceButtons(agent, choices);
    parts.push(choices);
  } else if (agent.status === "working") {
    const working = el("div", "working");
    working.append(el("i"), el("i"), el("i"));
    if (agent.brief) working.append(el("span", "", agent.brief));
    parts.push(working);
  }
  for (const text of agent.queued) {
    const node = el("div", "item prompt queued");
    const cancel = el("button", "unqueue", "✕");
    cancel.title = "Do not send";
    postOnClick(cancel, "unqueue", { id: agent.id, text });
    node.append(el("span", "", text), el("small", "", "queued"), cancel);
    parts.push(node);
  }
  $("d-live").replaceChildren(...parts);
  if (bottom) scrollToBottom();
}

const toolMarks = { pending: "○", in_progress: "◐", completed: "✓", failed: "✗" };

function renderTool(node, item) {
  const wasOpen = node.querySelector("details")?.open;
  node.className = "item tool " + item.status;
  const head = el("div", "tool-head");
  head.append(el("span", "tool-mark", toolMarks[item.status] || "•"),
              el("span", "", item.title || item.kind || "tool"),
              el("span", "meta", item.status));
  const parts = [head];
  if (item.diff) {
    const details = el("details");
    details.open = !!wasOpen;
    const pre = el("pre", "diff");
    for (const line of item.diff.split("\n")) {
      const kind = line.startsWith("@@") ? "hunk"
            : line.startsWith("+") && !line.startsWith("+++") ? "add"
            : line.startsWith("-") && !line.startsWith("---") ? "del" : "";
      pre.append(el("span", kind, line + "\n"));
    }
    details.append(el("summary", "", "diff"), pre);
    parts.push(details);
  }
  if (item.images.length) parts.push(imageStrip(item.images));
  node.replaceChildren(...parts);
}

const atBottom = () => {
  const detail = $("detail");
  return detail.scrollTop + detail.clientHeight >= detail.scrollHeight - 80;
};
function scrollToBottom() {
  $("detail").scrollTop = $("detail").scrollHeight;
}
let pinned = true;
$("detail").addEventListener("scroll", () => { pinned = atBottom(); }, {passive: true});
if (window.ResizeObserver) new window.ResizeObserver(() => { if (pinned) scrollToBottom(); }).observe($("detail"));

// A reply's markdown, drawn at most four times a second as it streams.
function renderReply(node) {
  const wait = node.drawn + 250 - Date.now();
  if (wait > 0) {
    node.timer ??= setTimeout(() => { node.timer = null; renderReply(node); }, wait);
    return;
  }
  const bottom = atBottom();
  node.drawn = Date.now();
  node.innerHTML = markdown(node.source);
  if (node.images.length) node.append(imageStrip(node.images));
  if (bottom) scrollToBottom();
}

// False when a reply's text does not follow on what the node holds.
function renderItem(follow, item) {
  let node = follow.nodes.get(item.item);
  const fresh = !node;
  if (fresh) {
    node = el("div");
    follow.nodes.set(item.item, node);
  }
  switch (item.type) {
    case "prompt": node.className = "item prompt"; node.textContent = item.text; break;
    case "text":
      if ((node.source ?? "").length !== item.offset) return false;
      node.className = "item md";
      node.source = (node.source ?? "") + item.text;
      node.images = item.images;
      node.drawn ??= 0;
      renderReply(node);
      break;
    case "tool": renderTool(node, item); break;
    case "end": node.className = "item end"; node.textContent = "turn ended"; break;
    case "error": node.className = "item error"; node.textContent = item.text; break;
  }
  if (!["tool", "text"].includes(item.type) && item.images.length) node.append(imageStrip(item.images));
  if (fresh) $("d-feed").append(node);
  return true;
}

const folds = JSON.parse(localStorage.getItem("overlook-folds") || "{}");

function saveFolds() {
  localStorage.setItem("overlook-folds", JSON.stringify(folds));
}

function run(span) {
  const node = el("span", "", span.icon ? "" : span.text);
  if (span.icon) node.append(icon(span.icon));
  for (const style of span.styles) node.classList.add("s-" + style.replace(/[^A-Za-z0-9_-]/g, "-"));
  return node;
}

// A piece whose runs of ━ stretch, sharing its width by their lengths.
function meterPiece(piece) {
  const node = el("span", "piece");
  for (const part of piece) {
    for (const text of part.icon ? [part.text] : part.text.split(/(━+)/).filter(Boolean)) {
      const segment = run({ ...part, text });
      if (!part.icon && /^━+$/.test(text)) {
        segment.classList.add("meter");
        segment.style.flex = text.length + " 1 0";
      }
      node.append(segment);
    }
  }
  return node;
}

// A piece whose wide gaps stretch; spaces ending it keep their width.
function metricPiece(piece) {
  const node = el("span", "piece metric");
  for (const [index, part] of piece.entries()) {
    const last = index === piece.length - 1;
    const value = last ? part.text.trimEnd() : part.text;
    for (const text of part.icon ? [value] : value.split(/(\s{2,})/).filter(Boolean)) {
      const segment = run({ ...part, text });
      if (/^\s{2,}$/.test(text)) segment.classList.add("metric-gap");
      node.append(segment);
    }
    const tail = last && part.text.match(/\s+$/)?.[0];
    if (tail) {
      const reserved = el("span", "", tail);
      reserved.style.flex = "none";
      node.append(reserved);
    }
  }
  return node;
}

// Pieces that wrap, under what came before them, lines starting where the first did.
function wrapInto(text, span) {
  const usage = !!text.querySelector(".pad");
  const lead = el("span", "lead");
  lead.append(...text.childNodes);
  const wrap = el("span", "wrap");
  wrap.style.columnGap = span.gap + "ch";
  for (const piece of span.wrap) {
    const metric = usage && !piece.some(part => part.text.includes("━"));
    wrap.append(metric ? metricPiece(piece) : meterPiece(piece));
  }
  text.append(lead, wrap);
}

function runs(className, spans) {
  const node = el("span", className);
  node.append(...spans.map(run));
  return node;
}

function spansInto(container, spans) {
  const text = el("span", "text");
  let right = null;
  for (const span of spans) {
    if (span.pad) {
      const padded = runs("pad", span.pad);
      const widths = span.labels.map((label) => label.reduce((width, part) =>
        width + (part.icon && iconPath(part.icon) ? 2 : [...part.text].length), 0));
      padded.style.width = Math.max(0, ...widths) + "ch";
      text.append(padded);
    }
    else if (span.right) (right ??= el("span", "right")).append(runs("", span.right));
    else if (span.wrap) wrapInto(text, span);
    else if (span.fit) (right || text).append(runs("fit", span.fit));
    else if (right) right.lastChild.append(run(span));
    else text.append(run(span));
  }
  container.append(text);
  if (right) container.append(right);
}

function renderNode(node, top) {
  const box = el("div", top ? "section node" : "node");
  const line = el("div", "line");
  const kids = node.children.length > 0;
  const folded = node.id in folds ? folds[node.id] : !!node.folded;
  if (folded && kids) box.classList.add("folded");
  if (node.heading) line.classList.add("heading");
  if (node.attention) line.classList.add("attention");
  if (!top) line.append(el("span", "twist", kids ? (folded ? "▸" : "▾") : ""));
  spansInto(line, node.spans);
  if (node.agent) {
    line.classList.add("link", "agent");
    line.onclick = () => open(node.agent);
  } else if (kids) {
    line.classList.add("link");
    line.onclick = () => {
      const now = !box.classList.contains("folded");
      box.classList.toggle("folded", now);
      folds[node.id] = now;
      saveFolds();
      const twist = line.querySelector(".twist");
      if (twist) twist.textContent = now ? "▸" : "▾";
    };
  }
  box.append(line);
  if (node.commands?.length) {
    const more = el("button", "more", "⋯");
    more.onclick = (event) => {
      event.stopPropagation();
      if (panel?.node.id === node.id) closePanel();
      else openPanel(box, node);
    };
    line.append(more);
  }
  if (node.agent && node.choices.length) {
    const choices = el("div", "choices");
    choiceButtons({ id: node.agent, choices: node.choices }, choices);
    box.append(choices);
  }
  if (kids) {
    const children = el("div", "children");
    children.append(...node.children.map((child) => renderNode(child, false)));
    box.append(children);
  }
  return box;
}

// The commands shown under a row of the dashboard: { node, box, name, text,
// option }, name set once one that asks for more is picked.  The dashboard
// is not redrawn while it shows, so what is typed stays.
let panel = null;
let pendingSections = null;

function closePanel() {
  panel?.box.querySelector(":scope > .commands")?.remove();
  panel = null;
  if (pendingSections) {
    const sections = pendingSections;
    pendingSections = null;
    renderDashboard(sections);
  }
}

function openPanel(box, node, state = {}) {
  if (panel && panel.box !== box) panel.box.querySelector(":scope > .commands")?.remove();
  panel = { text: "", option: null, ...state, node, box };
  box.querySelector(":scope > .commands")?.remove();
  const container = el("div", "commands");
  const button = (label, className, onclick) => {
    const b = el("button", className, label);
    b.onclick = (event) => { event.stopPropagation(); onclick(b); };
    return b;
  };
  const command = node.commands.find((c) => c.name === panel.name);
  if (!command) {
    for (const c of node.commands) {
      container.append(button(c.label, c.confirm ? "danger" : "", (b) => {
        if (c.input || c.options) openPanel(box, node, { name: c.name });
        else runCommand(node, c, {}, b);
      }));
    }
  } else if (!command.input) {
    for (const option of command.options) {
      container.append(button(option, "", (b) => runCommand(node, command, { option }, b)));
    }
  } else {
    let select = null;
    if (command.options) {
      select = el("select");
      for (const option of command.options) select.append(new Option(option, option));
      if (panel.option) select.value = panel.option;
      select.onchange = () => { panel.option = select.value; };
      container.append(select);
    }
    const text = el("textarea");
    text.placeholder = command.input;
    text.value = panel.text;
    text.oninput = () => { panel.text = text.value; };
    container.append(text, button("Send", "primary", (b) =>
      runCommand(node, command, { text: text.value, option: select?.value }, b)));
  }
  container.append(button("Cancel", "", closePanel));
  box.querySelector(":scope > .line").after(container);
  container.querySelector("textarea")?.focus();
}

async function runCommand(node, command, args, button) {
  button.disabled = true;
  try {
    const body = { node: node.id, name: command.name, ...args };
    let result = await call("POST", "command", body);
    if (result.confirm) {
      if (!confirm(result.confirm)) { button.disabled = false; return; }
      result = await call("POST", "command", { ...body, confirmed: true });
    }
    closePanel();
    if (result.agent) open(result.agent);
    else toast(command.label + ": done");
  } catch (error) {
    toast(error.message);
    button.disabled = false;
  }
}

function renderDashboard(sections) {
  if (panel) {
    pendingSections = sections;
    return;
  }
  const dash = $("dash");
  if (!sections.length) {
    dash.replaceChildren(el("p", "empty", "The dashboard is empty."));
    return;
  }
  dash.replaceChildren(...sections.map((section) => renderNode(section, true)));
  const waiting = dash.querySelectorAll(".choices").length;
  document.title = waiting ? `(${waiting}) overlook` : "overlook";
}

// The long poll of the view shown: its url() and what it does with news(),
// which throws a Stale error when it must start over from nothing.
// With stream(), news comes as server-sent events, and long polls only
// where those fail.
let poller = null;

class Stale extends Error {}

function stopPolling() {
  poller?.controller?.abort();
  poller = null;
}

// Polls until another poller takes over or the page hides; resume() picks it up again.
async function poll(mine) {
  const controller = new AbortController();
  mine.controller = controller;
  poller = mine;
  let failures = 0;
  const current = () => poller === mine && mine.controller === controller;
  while (current() && !document.hidden) {
    try {
      if (mine.stream && mine.known) {
        await listen(mine, controller.signal, current);
        continue;
      }
      const news = await call("GET", mine.url(), undefined, controller.signal);
      if (!current()) return;
      mine.news(news);
      connected();
      failures = 0;
    } catch (error) {
      if (error instanceof Stale) continue;
      if (!current() || error.name === "AbortError") return;
      if (connectionFailure(error)) return;
      if (mine.stream && error.status) { mine.stream = null; continue; }
      await sleep(Math.min(30000, 1000 * 2 ** Math.min(failures++, 5)));
    }
  }
}

// Reads mine.stream()'s events until the connection ends or goes quiet.
async function listen(mine, signal, current) {
  const quiet = new AbortController();
  const abort = () => quiet.abort();
  signal.addEventListener("abort", abort, { once: true });
  let timer;
  const wake = () => { clearTimeout(timer); timer = setTimeout(() => quiet.abort(), 60000); };
  wake();
  try {
    const response = await fetch("/overlook/api/" + mine.stream(), {
      headers: { "Authorization": "Bearer " + token }, signal: quiet.signal,
    });
    if (!response.ok || !response.body
        || !response.headers.get("Content-Type")?.startsWith("text/event-stream")) {
      const error = new Error("no stream");
      error.status = response.status;
      throw error;
    }
    if (!current()) return;
    connected();
    const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (!current()) return;
      if (done) throw new TypeError("Stream ended");
      wake();
      buffer += value;
      let end;
      while ((end = buffer.indexOf("\n\n")) >= 0) {
        const data = buffer.slice(0, end).split("\n")
          .filter((line) => line.startsWith("data:")).map((line) => line.slice(5)).join("\n");
        buffer = buffer.slice(end + 2);
        if (data) { mine.news(JSON.parse(data)); connected(); }
      }
    }
  } catch (error) {
    if (error.name === "AbortError" && !signal.aborted) throw new TypeError("Connection timed out");
    throw error;
  } finally {
    clearTimeout(timer);
    signal.removeEventListener("abort", abort);
    quiet.abort();
  }
}

function resume() {
  if (!poller || document.hidden || connectionBlocked) return;
  poller.controller?.abort();
  poll(poller);
}

// Nodes a dashboard sent as { same: hash } taken from what the page has.
function expand(nodes, known) {
  return nodes.map((node) => {
    if (!node.same) return { ...node, children: expand(node.children, known) };
    if (!known.has(node.same)) throw new Stale();
    return known.get(node.same);
  });
}

function index(nodes, known = new Map()) {
  for (const node of nodes) {
    known.set(node.hash, node);
    index(node.children, known);
  }
  return known;
}

function watchDashboard() {
  $("dash").replaceChildren(el("p", "empty", "Loading dashboard…"));
  const mine = { known: "", nodes: new Map() };
  mine.url = () => "dashboard?known=" + mine.known;
  mine.stream = () => "dashboard/stream?known=" + mine.known;
  mine.news = (news) => {
    if (news.known === mine.known) return;
    let sections;
    try { sections = expand(news.sections, mine.nodes); }
    catch (error) {
      mine.known = "";
      mine.nodes = new Map();
      throw error;
    }
    renderDashboard(sections);
    mine.nodes = index(sections);
    mine.known = news.known;
  };
  poll(mine);
}

async function followAgent(id) {
  const mine = { id, after: 0, known: "", epoch: "", nodes: new Map() };
  mine.url = () => `events?id=${encodeURIComponent(id)}&after=${mine.after}&known=${mine.known}`
    + `&epoch=${mine.epoch}`;
  mine.news = (news) => {
    if (news.reset) {
      mine.nodes.clear();
      $("d-feed").replaceChildren();
    }
    const bottom = atBottom();
    renderHeader(news.agent);
    mine.epoch = news.epoch;
    if (!news.items.every((item) => renderItem(mine, item))) {
      mine.after = 0;
      mine.nodes.clear();
      $("d-feed").replaceChildren();
      throw new Stale();
    }
    $("d-earlier").hidden = mine.nodes.size > 0;
    if (bottom && news.items.length) scrollToBottom();
    mine.after = news.seq;
    mine.known = news.known;
  };
  poller = mine;
  $("d-feed").replaceChildren();
  $("d-earlier").hidden = true;
  try {
    const agent = await call("GET", "agent?id=" + encodeURIComponent(id));
    if (poller !== mine) return;
    connected();
    renderHeader(agent);
    $("d-reply").innerHTML = agent.reply ? markdown(agent.reply) : "<p>(none yet)</p>";
    $("d-transcript").textContent = agent.transcript;
  } catch (error) {
    if (poller !== mine) return;
    if (connectionFailure(error)) return;
  }
  if (poller === mine) poll(mine);
}

function current() {
  return new URLSearchParams(location.search).get("agent");
}

function view() {
  return current() ? "agent" : new URLSearchParams(location.search).get("view") === "agents" ? "agents" : "dashboard";
}

function open(id) {
  history.pushState(null, "", "?agent=" + encodeURIComponent(id) + location.hash);
  show();
}

function show() {
  viewGeneration++;
  connectionBlocked = false;
  $("connection").hidden = true;
  saveCompose();
  const id = current();
  if (composeId !== id) composing = false;
  composeId = id;
  const shown = view();
  $("dash").hidden = shown !== "dashboard";
  $("list").hidden = shown !== "agents";
  $("detail").hidden = !id;
  $("compose").hidden = !id;
  if (id) syncCompose();
  $("back").hidden = !id;
  $("switch").hidden = !!id;
  $("switch").textContent = shown === "agents" ? "Dashboard" : "Agents";
  stopPolling();
  shownList = shownHeader = "";
  agentControls = {};
  $("steer").hidden = $("session-menu").hidden = true;
  $("context").hidden = true;
  $("session-menu").open = false;
  renderSlashCommands();
  panel = pendingSections = null;
  if (!token) {
    $("dash").replaceChildren(el("p", "empty", "Open this page from M-x overlook-remote-url in Emacs."));
    return;
  }
  if (id) followAgent(id);
  else {
    $("heading").textContent = "overlook";
    if (shown === "agents") refresh();
    else watchDashboard();
  }
}

let busy = false;
async function refresh() {
  if (!token || view() !== "agents" || busy || document.hidden || connectionBlocked) return;
  busy = true;
  const generation = viewGeneration;
  try {
    const { agents } = await call("GET", "agents");
    if (generation !== viewGeneration) return;
    renderList(agents);
    const waiting = agents.filter((a) => a.status === "waiting").length;
    document.title = waiting ? `(${waiting}) overlook` : "overlook";
    connected();
  } catch (error) {
    if (generation === viewGeneration) connectionFailure(error);
  } finally {
    busy = false;
  }
}

$("reconnect").onclick = () => show();
$("return-dashboard").onclick = () => {
  history.pushState(null, "", location.pathname + location.hash);
  show();
};
window.addEventListener("online", () => { if (!connectionBlocked) { refresh(); resume(); } });
window.addEventListener("offline", () => connectionFailure(new TypeError("offline")));
$("back").onclick = () => history.back();
$("switch").onclick = () => {
  history.replaceState(null, "", (view() === "agents" ? location.pathname : "?view=agents") + location.hash);
  show();
};
window.onpopstate = show;
document.addEventListener("visibilitychange", () => { refresh(); resume(); });

function finishComposition() {
  composing = false;
  if (composeId) {
    const state = draft(composeId);
    state.text = $("text").value;
    state.revision++;
    for (const text of state.pendingAttachments) appendText(state, text);
    state.pendingAttachments = [];
    syncCompose();
  }
}
$("text").addEventListener("compositionstart", () => {
  composing = true;
  if (composeId) draft(composeId).revision++;
});
$("text").addEventListener("compositionend", finishComposition);
$("text").addEventListener("blur", () => { if (composing) finishComposition(); });
$("text").addEventListener("input", (event) => {
  if (composeId) {
    draft(composeId).text = event.target.value;
    draft(composeId).revision++;
  }
  if (event.isComposing || composing) return;
  renderSlashCommands();
  resizeCompose();
});

const sendable = ["image/png", "image/jpeg", "image/gif", "image/webp"];

async function prepare(file) {
  if (sendable.includes(file.type) && file.size <= 2500000) return file;
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, 2000 / Math.max(bitmap.width, bitmap.height));
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(bitmap.width * scale);
  canvas.height = Math.round(bitmap.height * scale);
  canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  return new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.85));
}

function base64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.slice(reader.result.indexOf(",") + 1));
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(blob);
  });
}

async function attach(file) {
  saveCompose();
  const id = current();
  const state = draft(id);
  if (state.pending) return;
  state.uploading++;
  const preview = el("img");
  preview.src = URL.createObjectURL(file);
  preview.style.opacity = ".4";
  state.previews.push(preview);
  syncCompose();
  try {
    const blob = await prepare(file);
    const { text } = await call("POST", "upload", { id, mime: blob.type, data: await base64(blob) });
    saveCompose();
    if (composing && composeId === id) state.pendingAttachments.push(text);
    else appendText(state, text);
    state.revision++;
    preview.style.opacity = "1";
  } catch (error) {
    state.previews = state.previews.filter(node => node !== preview);
    URL.revokeObjectURL(preview.src);
    toast(error.message);
  } finally {
    state.uploading--;
    if (composeId === id) syncCompose();
  }
}

$("attach").onclick = () => $("files").click();
$("files").onchange = (event) => {
  [...event.target.files].forEach(attach);
  event.target.value = "";
};

$("send").onclick = async () => {
  saveCompose();
  const id = current();
  const state = draft(id);
  const text = state.text.trim();
  if (!text || composing || state.pending || state.uploading) return;
  const revision = state.revision;
  state.pending = true;
  syncCompose();
  try {
    const { queued } = await call("POST", "prompt", { id, text,
      requestId: requestId(state, "send", text) });
    saveCompose();
    acknowledge(id, state, revision, text);
    toast(queued ? "Queued; it goes once the agent is free" : "Sent");
  } catch (error) {
    toast(error.message);
  } finally {
    state.pending = false;
    if (composeId === id) syncCompose();
  }
};

$("steer").onclick = () => sessionAction("steer", $("steer"));

show();
setInterval(refresh, 2500);
</script>

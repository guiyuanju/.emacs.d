<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="overlook">
<meta name="color-scheme" content="light dark">
<title>overlook</title>
<link rel="stylesheet" href="/overlook/vendor/framework7.css">
<style>
  :root {
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    --f7-font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    --f7-font-size: 17px;
    --f7-list-inset-side-margin: 20px;
    --f7-list-inset-border-radius: 12px;
    --bg: #f2f2f7; --fg: #1c1c1e; --dim: #6c6c70; --line: rgba(60,60,67,.16);
    --soft: #e5e5ea; --card: #fff; --accent: #007aff; --on-accent: #fff; --name: var(--fg);
    --working: #a56800; --waiting: #c93436; --failed: #c93436; --done: #248a3d; --idle: #8e8e93;
    --wait-bg: rgba(255,59,48,.07); --done-bg: rgba(52,199,89,.07);
  }
  .dark {
    --bg: #000; --fg: #f2f2f7; --dim: #98989f; --line: rgba(84,84,88,.65);
    --soft: #2c2c2e; --card: #1c1c1e; --accent: #0a84ff; --name: var(--fg);
    --working: #ffd60a; --waiting: #ff6961; --failed: #ff6961; --done: #30d158;
  }
  html.ios {
    --f7-font-family: -apple-system, BlinkMacSystemFont, system-ui, "Helvetica Neue", Arial, sans-serif;
    --f7-font-size: 17px;
    --f7-theme-color: #007aff;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: var(--f7-font-family); font-size: 17px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
  button, input, textarea, select { font: inherit; letter-spacing: inherit; }
  button, a { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  ::selection { background: rgba(0,122,255,.22); }
  body { position: fixed; inset: 0; margin: 0; overflow: hidden; background: var(--bg); color: var(--fg); }
  :is(#app,[data-snapshot-id="app"]), .view { height: 100%; overflow: hidden; }
  .remote-page { display: flex; flex-direction: column; background: var(--bg); }
  .page-snapshot { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
  button { font-family: inherit; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  button.link { width: auto; border: 0; background: transparent; color: var(--accent); }
  .remote-page > .remote-navbar { position: relative; flex: none; height: calc(52px + env(safe-area-inset-top)); padding-top: env(safe-area-inset-top); }
  .remote-navbar .navbar-bg { background: var(--bg); box-shadow: none; }
  .ios .remote-navbar .navbar-inner { position: relative; height: 52px; padding: 0 12px; display: grid; grid-template-columns: 72px minmax(0,1fr) 72px; gap: 8px; }
  .ios .remote-navbar .left, .ios .remote-navbar .right {
    position: static; height: 44px; min-width: 0; margin: 0; padding: 0;
    background: transparent; box-shadow: none; backdrop-filter: none; border-radius: 0;
  }
  .ios .remote-navbar .left { justify-content: flex-start; }
  .ios .remote-navbar .right { justify-content: flex-end; }
  .ios .remote-navbar .title { position: static; width: 100%; margin: 0; transform: none !important; text-align: center; font-size: 17px; font-weight: 600; line-height: 20px; display: flex; flex-direction: column; justify-content: center; align-self: center; height: 44px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  :is(#back,[data-snapshot-id="back"]) { display: flex; align-items: center; gap: 3px; padding: 0; height: 44px; font-size: 17px; }
  :is(#back,[data-snapshot-id="back"]) .icon { width: 20px; height: 22px; }
  :is(#session-menu,[data-snapshot-id="session-menu"]) { width: 44px; height: 44px; padding: 0; font-size: 27px; line-height: 44px; }
  .navigation-title { display: block; overflow: hidden; text-overflow: ellipsis; line-height: 21px; }
  .navigation-subtitle { display: block; margin-top: 1px; font-size: 11px; line-height: 14px; font-weight: 400; color: var(--dim); }
  .remote-page.home > .remote-navbar { display: none; }
  .icon { display: inline-block; width: 22px; height: 22px; vertical-align: -4px; object-fit: contain; }
  :is(#heading,[data-snapshot-id="heading"]) .icon { width: 18px; height: 18px; margin-right: 6px; }
  .remote-content { flex: 1; min-height: 0; height: auto; overscroll-behavior: contain; overflow-x: hidden; }
  .remote-page > :is(#dash,[data-snapshot-id="dash"]) { padding: 8px 0 calc(32px + env(safe-area-inset-bottom)); }
  .remote-page:not(.home) > :is(#dash,[data-snapshot-id="dash"]) { padding-top: 24px; }
  .remote-page.home > :is(#dash,[data-snapshot-id="dash"]) { padding-top: calc(22px + env(safe-area-inset-top)); }
  .screen-intro { margin: 8px 20px 30px; }
  .screen-intro h1 { margin: 0; font-size: 34px; line-height: 1.2; letter-spacing: .35px; font-weight: 700; }
  .screen-intro p { margin: 8px 0 0; font-size: 15px; line-height: 1.4; color: var(--dim); }
  .dashboard-section { margin: 0 0 28px; }
  .dashboard-section > .block-title { color: var(--dim); font-size: 13px; font-weight: 400; line-height: 18px; text-transform: uppercase; letter-spacing: .2px; white-space: normal; margin: 0 36px 8px; }
  :is(#dashboard-content,[data-snapshot-id="dashboard-content"]) .list { margin: 0 20px; background: var(--card); border-radius: 12px; }
  :is(#dashboard-content,[data-snapshot-id="dashboard-content"]) .list > ul { background: var(--card); border-radius: inherit; overflow: hidden; }
  .remote-item { position: relative; }
  :is(#dashboard-content,[data-snapshot-id="dashboard-content"]) .remote-row { width: 100%; min-height: 60px; border: 0; border-radius: 0; background: transparent; color: var(--fg); text-align: left; padding-left: 16px; font: inherit; }
  :is(#dashboard-content,[data-snapshot-id="dashboard-content"]) .remote-row .item-inner { min-width: 0; min-height: 60px; padding: 16px 16px 16px 0; }
  :is(#dashboard-content,[data-snapshot-id="dashboard-content"]) .remote-row.item-link .item-inner { padding-right: 34px; }
  .remote-item:has(> .more) .remote-row .item-inner { padding-right: 56px !important; }
  .remote-item:has(> .more) .remote-row.item-link .item-inner::after { display: none; }
  .remote-row:active { background: var(--soft) !important; transition: background .12s; }
  .line { display: flex; align-items: center; gap: 12px; width: 100%; min-width: 0; font-size: 17px; line-height: 1.35; overflow-wrap: anywhere; }
  .line .text { flex: 1; min-width: 0; }
  .group-icon { width: 30px; min-width: 30px; margin-right: 14px; color: var(--accent); }
  .group-icon svg { display: block; width: 28px; height: 28px; }
  :is(#dashboard-content,[data-snapshot-id="dashboard-content"]) .group-row .item-inner { min-height: 56px; padding-top: 14px; padding-bottom: 14px; margin-left: 0; }
  :is(#dashboard-content,[data-snapshot-id="dashboard-content"]) .group-row .remote-row { min-height: 56px; }
  .group-row .line { gap: 12px; }
  .group-row .text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 400; }
  .group-count { flex: none; color: var(--dim); font-size: 17px; font-variant-numeric: tabular-nums; }

  .line .right { display: flex; flex: none; gap: 6px; font-size: 13px; color: var(--dim); white-space: nowrap; }
  .row-title { display: block; }
  .row-subtitle { display: block; margin-top: 4px; font-size: 13px; line-height: 1.45; color: var(--dim); font-weight: 400; }
  .row-icon { flex: none; width: 28px; min-width: 28px; margin: 0 12px 0 0; align-self: center; }
  .row-icon svg { display: block; width: 24px; height: 24px; }
  :is(#dashboard-content,[data-snapshot-id="dashboard-content"]) .remote-row .item-inner { margin-left: 0; }
  .conversation-row .row-icon { align-self: flex-start; margin-top: 18px; width: 36px; min-width: 36px; height: 36px; display: grid; place-items: center; background: var(--bg); border-radius: 10px; }
  .conversation-row .row-title { font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .agent-meta { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 7px; color: var(--dim); font-size: 12px; line-height: 1.4; }
  .agent-state { display: inline-flex; align-items: center; gap: 5px; }
  .agent-state::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--idle); }
   .agent-state.state-working::before { background: var(--accent); }
   .agent-state.state-waiting::before,  .agent-state.state-failed::before { background: var(--waiting); }
   .agent-state.state-done::before { background: var(--done); }
  .change-counts { display: flex; gap: 8px; margin-top: 5px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .change-counts .added { color: var(--done); }
  .change-counts .removed { color: var(--failed); }
  .task-row .row-title { white-space: normal; }
  .task-icon { color: var(--accent); }
  .task-due { display: block; color: var(--dim); font-size: 12px; margin-top: 6px; }
  .remote-item > .task-check { position: absolute; z-index: 2; left: 7px; top: 8px; width: 44px; height: 44px; padding: 0; border: 0; background: transparent; color: var(--accent); border-radius: 50%; display: grid; place-items: center; }
  .task-check svg { width: 24px; height: 24px; }
  .remote-item > .task-check:active { background: rgba(0,122,255,.12); }
  .project-empty { margin: 48px 32px; text-align: center; color: var(--dim); font-size: 15px; }
  .file-icon { width: 24px; min-width: 24px; margin-right: 14px; color: var(--dim); }
  .file-icon svg { display: block; width: 24px; height: 24px; }
  .file-row .line { font-size: 15px; line-height: 1.45; }
  .file-row .text { min-width: 0; overflow-wrap: anywhere; }
  .remote-item > .more { position: absolute; top: 8px; right: 8px; width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: var(--accent); font-size: 25px; line-height: 1; z-index: 2; }
  .remote-item > .more:active { background: var(--soft); }
  .remote-item > .choices { padding: 0 16px 16px; margin: 0; }
  .usage-row .item-inner { padding-top: 20px !important; padding-bottom: 22px !important; }
  .usage-account { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; font-size: 17px; font-weight: 600; }
  .usage-account-name { margin-left: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 400; color: var(--dim); }
  .usage-account .icon { width: 24px; height: 24px; }
  .usage-windows { display: grid; gap: 20px; }
  .usage-window { min-width: 0; }
  .usage-caption { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; font-size: 13px; }
  .usage-label { color: var(--dim); }
  .usage-value { font-weight: 600; font-variant-numeric: tabular-nums; }
  .usage-reset { display: block; margin-top: 6px; color: var(--dim); font-size: 12px; }
  .usage-window .progressbar { height: 6px; border-radius: 3px; --f7-progressbar-bg-color: var(--soft); --f7-progressbar-progress-color: var(--accent); }
  .usage-window.warning .progressbar { --f7-progressbar-progress-color: var(--working); }
  .usage-window.warning .usage-value { color: var(--working); }
  .usage-window .progressbar span { border-radius: inherit; }
  .sync-footer { margin: 28px 24px 0; text-align: center; color: var(--dim); font-size: 12px; line-height: 18px; }
  :is(#connection,[data-snapshot-id="connection"]) { flex: none; margin: 8px 20px; padding: 14px 16px; border-radius: 12px; background: var(--wait-bg); font-size: 15px; line-height: 1.4; }
  :is(#connection,[data-snapshot-id="connection"]) .button { display: inline-flex; width: auto; margin: 10px 10px 0 0; }
  .remote-page > :is(#detail,[data-snapshot-id="detail"]) { padding: 12px 20px 24px; background: var(--card); }
  :is(#detail-meta,[data-snapshot-id="detail-meta"]) { display: flex; justify-content: center; gap: 8px; margin: 0 0 20px; color: var(--dim); font-size: 12px; }
  :is(#detail-meta,[data-snapshot-id="detail-meta"]):has(:is(#context,[data-snapshot-id="context"])[hidden]) { display: none; }
  :is(#context,[data-snapshot-id="context"]) .icon { width: 14px; height: 14px; }
  .markdown { font-size: 17px; line-height: 1.6; overflow-wrap: anywhere; }
  .markdown > :first-child { margin-top: 0; }
  .markdown h1, .markdown h2, .markdown h3 { font-size: 20px; line-height: 1.3; letter-spacing: -.25px; margin: 24px 0 12px; }
  .markdown h1 { font-size: 26px; }
  .markdown h3 { font-size: 17px; }
  .markdown p { margin: 0 0 16px; }
  .markdown > :last-child { margin-bottom: 0; }
  .markdown ul, .markdown ol { padding-left: 24px; }
  .markdown li { margin: 6px 0; }
  .markdown a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
  .markdown :not(pre) > code { padding: 2px 5px; border-radius: 5px; background: var(--bg); font-size: .85em; }
  .markdown hr { border: 0; border-top: .5px solid var(--line); margin: 24px 0; }
  .markdown table { display: block; overflow-x: auto; border-collapse: collapse; }
  .markdown th, .markdown td { border-bottom: 1px solid var(--line); padding: 10px 12px; }
  .markdown blockquote { border-left: 3px solid var(--line); margin-left: 0; padding-left: 16px; color: var(--dim); }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bg); padding: 16px; border-radius: 12px; font: 13px/1.5 var(--mono); }
  .markdown pre { white-space: pre; overflow-x: auto; }
  code { font-family: var(--mono); }
  .item { margin: 24px 0; }
  .prompt { width: fit-content; max-width: calc(100% - 32px); margin-left: auto; padding: 12px 16px; border-radius: 20px 20px 6px 20px; background: var(--accent); color: #fff; font-size: 17px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
  .prompt.queued { background: var(--bg); color: var(--dim); display: flex; gap: 8px; align-items: baseline; }
  .prompt.queued span { flex: 1; }
  .prompt.queued small { font-size: 12px; }
  .unqueue { flex: none; width: 32px; height: 32px; border: 0; background: transparent; color: var(--accent); }
  .working { display: flex; align-items: center; gap: 10px; margin: 20px 0; color: var(--dim); font-size: 15px; }
  .working > .preloader { width: 18px; height: 18px; flex: none; }
  .working > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tool { padding: 12px 14px; background: var(--bg); border-radius: 12px; color: var(--dim); font-size: 14px; }
  .tool-head { display: flex; gap: 8px; align-items: baseline; }
  .tool-head span:nth-child(2) { font-weight: 500; flex: 1; min-width: 0; color: var(--fg); overflow-wrap: anywhere; }
  .tool-head .meta { font-size: 12px; color: var(--dim); white-space: nowrap; }
  .scroll-latest { position: absolute; z-index: 5; right: 20px; bottom: 84px; width: 44px; height: 44px; padding: 0; border: .5px solid var(--line); border-radius: 50%; color: var(--accent); background: var(--card); box-shadow: 0 2px 10px #00000012; display: grid; place-items: center; }
  .scroll-latest svg { width: 22px; height: 22px; }
  .tool details summary { padding: 12px 0 2px; color: var(--accent); cursor: pointer; font-size: 14px; }
  .tool.failed .tool-mark, .error, .diff .del { color: var(--failed); }
  .tool.completed .tool-mark, .diff .add { color: var(--done); }
  .tool.pending .tool-mark, .tool.in_progress .tool-mark { color: var(--working); }
  pre.diff { white-space: pre; overflow-x: auto; word-break: normal; font-size: 12px; }
  .diff .hunk { color: var(--accent); }
  .end { display: flex; align-items: center; gap: 14px; text-align: center; color: var(--dim); font-size: 12px; margin: 28px 0; }
  .end::before, .end::after { content: ""; flex: 1; height: .5px; background: var(--line); }
  .error { font-size: 15px; }
  .images { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .images img { max-height: 180px; max-width: 100%; border-radius: 12px; object-fit: contain; cursor: zoom-in; }
  :is(#compose,[data-snapshot-id="compose"]) { position: relative; flex: none; height: auto; padding-bottom: env(safe-area-inset-bottom); background: var(--card); border-top: .5px solid var(--line); }
  .ios :is(#compose,[data-snapshot-id="compose"])::before, .ios :is(#compose,[data-snapshot-id="compose"])::after { display: none; }
  :is(#compose,[data-snapshot-id="compose"]) .toolbar-inner { position: relative; height: auto; min-height: 64px; flex-wrap: wrap; gap: 10px; padding: 10px 16px; }
  .ios :is(#compose,[data-snapshot-id="compose"]) .messagebar-area { flex: 1; min-width: 0; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 23px; box-shadow: none; background: var(--bg); }
  :is(#text,[data-snapshot-id="text"]) { font: inherit; font-size: 17px; line-height: 22px; min-height: 44px; padding: 10px 14px; resize: none; border: 0; background: transparent; box-shadow: none; backdrop-filter: none; }
  :is(#compose,[data-snapshot-id="compose"]) :is(#attach,[data-snapshot-id="attach"]) { width: 32px; height: 44px; align-self: flex-end; padding: 0; font-size: 28px; }
  :is(#compose,[data-snapshot-id="compose"]) :is(#send,[data-snapshot-id="send"]) { align-self: flex-end; flex: none; margin: 6px 0; width: 32px; height: 32px; min-height: 32px; padding: 0; border-radius: 50%; background: var(--accent); color: #fff; font-size: 24px; line-height: 32px; font-weight: 600; }
  :is(#previews,[data-snapshot-id="previews"]) { width: 100%; margin: 0; }
  :is(#previews,[data-snapshot-id="previews"]):empty { display: none; }
  :is(#previews,[data-snapshot-id="previews"]) img { max-height: 64px; }
  .choices { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
  .choices .button, .commands .button { white-space: normal; height: auto; min-height: 44px; border-radius: 12px; font-size: 17px; padding: 10px 16px; }
  .choices b { margin-right: 8px; }
  :is(#slash-commands,[data-snapshot-id="slash-commands"]) { position: absolute; z-index: 2; bottom: 100%; left: 12px; right: 12px; max-height: 35vh; overflow-y: auto; background: var(--card); border: .5px solid var(--line); border-radius: 12px; box-shadow: 0 -4px 24px #0000000a; }
  :is(#slash-commands,[data-snapshot-id="slash-commands"]):empty { display: none; }
  :is(#slash-commands,[data-snapshot-id="slash-commands"]) .command-group { padding: 14px 16px 6px; color: var(--dim); font-size: 12px; text-transform: uppercase; }
  :is(#slash-commands,[data-snapshot-id="slash-commands"]) button { display: block; width: 100%; padding: 12px 16px; border: 0; border-bottom: .5px solid var(--line); border-radius: 0; background: transparent; color: var(--fg); text-align: left; font: inherit; }
  :is(#slash-commands,[data-snapshot-id="slash-commands"]) .command-name { display: block; font-weight: 500; }
  :is(#slash-commands,[data-snapshot-id="slash-commands"]) .command-description { display: block; margin-top: 4px; font-size: 13px; color: var(--dim); }
  .remote-sheet { height: min(75%, 600px); border-radius: 24px 24px 0 0; background: var(--bg); }
  .ios .remote-sheet::before { display: block; content: ""; position: absolute; top: 7px; left: calc(50% - 18px); width: 36px; height: 5px; border-radius: 3px; background: var(--dim); opacity: .4; transform: none; z-index: 3; }
  .remote-sheet .sheet-modal-inner { display: flex; flex-direction: column; }
  .remote-sheet .sheet-modal-inner > .toolbar { position: relative; flex: none; height: 68px; padding-top: 8px; background: var(--bg); }
  .ios .remote-sheet .toolbar::before, .ios .remote-sheet .toolbar::after { display: none; }
  .remote-sheet .toolbar-inner { justify-content: space-between; padding: 0 20px; }
  .remote-sheet .toolbar .title { font-size: 17px; font-weight: 600; }
  .remote-sheet .sheet-modal-inner > .page-content { position: relative; top: auto; bottom: auto; height: auto; padding: 12px 20px calc(24px + env(safe-area-inset-bottom)); flex: 1; min-height: 0; }
  .remote-sheet .commands { display: flex; flex-direction: column; gap: 16px; }
  .remote-sheet textarea, .remote-sheet select { width: 100%; padding: 16px; border: 0; border-radius: 12px; background: var(--card); color: var(--fg); font: inherit; font-size: 17px; }
  .remote-sheet textarea { min-height: 132px; resize: none; }
  .commands .danger { color: var(--failed); }
  .commands .button { width: 100%; }
  .commands .button.primary { color: #fff; background: var(--accent); font-weight: 600; }
  .remote-sheet textarea:focus, .remote-sheet select:focus { outline: none; box-shadow: none; }
  textarea::placeholder { color: #8e8e93; opacity: 1; }
  .composer-icon { display: block; width: 24px; height: 24px; margin: auto; }
  .remote-navbar::after { content: ""; position: absolute; bottom: 0; left: 0; right: 0; height: .5px; background: var(--line); }
  .remote-page:not(.home) .navbar-bg { background: var(--card); }
  @media (min-width: 700px) {
    .screen-intro, .dashboard-section, .sync-footer { max-width: 640px; margin-left: auto; margin-right: auto; }
    :is(#detail,[data-snapshot-id="detail"]) > * { max-width: 720px; margin-left: auto; margin-right: auto; }
    :is(#compose,[data-snapshot-id="compose"]) .toolbar-inner { max-width: 760px; margin: auto; }
  }
  .file-diff pre.diff { margin: 0; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .remote-row { transition: none; } }
</style>
</head>
<body>
<div id="app">
<div class="view view-main">
<div class="page page-current remote-page">
  <div class="navbar remote-navbar">
    <div class="navbar-bg"></div>
    <div class="navbar-inner">
      <div class="left"><button id="back" class="link" hidden aria-label="Back"><i class="icon icon-back"></i><span>Back</span></button></div>
      <div id="heading" class="title">overlook</div>
      <div class="right">
        <button id="session-menu" class="link" aria-label="Session menu" hidden>⋯</button>
      </div>
    </div>
  </div>
  <div id="connection" role="status" hidden>
    <span id="connection-message"></span><br>
    <button id="reconnect" class="button button-tonal button-small">Reconnect</button>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const app = new Framework7({ el: "#app", name: "overlook", theme: "ios", darkMode: "auto" });
// The launch URL reserves its hash for the credential and its query for the agent.
app.views.create(".view-main", { router: false });

function htmlText(text) {
  return String(text).replace(/[&<>"']/g, (character) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[character]);
}

function confirmAction(message) {
  return new Promise((resolve) => {
    app.dialog.create({ title: "overlook", text: htmlText(message), destroyOnClose: true,
      on: { closed: () => resolve(false) },
      buttons: [{ text: "Cancel", onClick: () => resolve(false) },
        { text: "Continue", bold: true, onClick: () => resolve(true) }] }).open();
  });
}

if (location.hash.length > 1) {
  localStorage.setItem("overlook-token", location.hash.slice(1));
}
const token = localStorage.getItem("overlook-token");
// Home Screen apps have their own storage; keep the credential in their launch URL.
if (token && !location.hash) {
  history.replaceState(null, "", location.pathname + location.search + "#" + token);
}

function toast(message) {
  toast.current?.close();
  toast.current = app.toast.create({ text: htmlText(message),
    closeTimeout: 4000, destroyOnClose: true });
  toast.current.open();
}

let lastSync = null;
let connectionBlocked = false;
let viewGeneration = 0;
function connected() {
  lastSync = new Date();
  connectionBlocked = false;
  $("conn").textContent = "Updated " + lastSync.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
  $("conn").title = "Last synced: " + lastSync.toLocaleString();
  $("connection").hidden = true;
}
function connectionFailure(error) {
  const auth = error.status === 401;
  const missing = error.code === "agent_missing";
  const incompatible = error.code === "protocol_mismatch";
  connectionBlocked = auth || missing || incompatible;
  const message = auth ? "Credential expired. Open a fresh link from Emacs: M-x overlook-remote-url."
    : incompatible ? "The app has been updated. Refresh this page to continue."
    : missing ? "This session no longer exists. Return to the dashboard to choose a session."
    : "Connection lost. Reconnecting…";
  $("conn").textContent = auth ? "Sign in" : missing ? "Session gone" : "Reconnecting";
  $("connection-message").textContent = message + (lastSync ? " Last synced: " + lastSync.toLocaleTimeString() : " No successful sync yet.");
  $("connection").hidden = false;
  $("return-dashboard").hidden = !missing;
  return connectionBlocked;
}

function checkProtocol(data) {
  if (data.protocolVersion !== undefined && data.protocolVersion !== 2) {
    const error = new Error("Refresh this page to use the updated app");
    error.code = "protocol_mismatch";
    throw error;
  }
  return data;
}

async function call(method, path, body, signal) {
  const controller = new AbortController();
  const abort = () => controller.abort();
  signal?.addEventListener("abort", abort, {once: true});
  if (signal?.aborted) controller.abort();
  const timeout = setTimeout(abort, 40000);
  try {
    const response = await fetch("/overlook/api/" + path, {
      method,
      headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
      body: body && JSON.stringify(body),
      signal: controller.signal,
    });
    const data = checkProtocol(await response.json());
    if (!response.ok) {
      const error = new Error(data.detail || data.error || response.statusText);
      error.status = response.status;
      error.code = data.code;
      throw error;
    }
    return data;
  } catch (error) {
    if (error.name === "AbortError" && !signal?.aborted) throw new TypeError("Request timed out; retry to check delivery");
    throw error;
  } finally {
    clearTimeout(timeout);
    signal?.removeEventListener("abort", abort);
  }
}

const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

DOMPurify.addHook("afterSanitizeAttributes", (node) => {
  if (node.tagName === "A") {
    node.setAttribute("target", "_blank");
    node.setAttribute("rel", "noopener noreferrer");
  }
});

function markdown(text) {
  return DOMPurify.sanitize(marked.parse(text, { gfm: true }), { FORBID_TAGS: ["style", "form", "img"] });
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (tag === "button" && !/(?:^| )(?:link|more|unqueue|remote-row|task-check)(?: |$)/.test(className || "")) {
    node.classList.add("button", className === "primary" ? "button-fill" : "button-tonal");
    if (className === "danger") node.classList.add("color-red");
  }
  if (text) node.textContent = text;
  return node;
}

  gemini: '<path fill="#4285f4" d="M12 1C11 8 8 11 1 12c7 1 10 4 11 11 1-7 4-10 11-11C16 11 13 8 12 1Z"/>',
  antigravity: '<g fill="#8b5cf6"><path d="m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3Z"/><path d="m20 1 1 2 2 1-2 1-1 2-1-2-2-1 2-1Z"/></g>',
  deepseek: '<g fill="none" stroke="#4d6bfe" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12c2-5 8-6 13-2l5-3-1 6c-1 6-11 9-16 3l-2-1m6-6 3-4 1 4"/><path d="M8 13h.01M4 19c4 2 9 2 13 0"/></g>',
  context: '<g fill="none" stroke="#888" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 3v9h9"/></g>',
};

const iconPath = (name) => iconPaths[String(name).toLowerCase()];

function icon(name, title = name) {
  const path = iconPath(name);
  if (!path) return el("span", "", name);
  const image = el("img", "icon");
  image.src = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">' + path + '</svg>');
  image.alt = name;
  image.title = title;
  return image;
}

const imageUrls = new Map();
let photoBrowser = null;

function imageUrl(n) {
  if (!imageUrls.has(n)) {
    imageUrls.set(n, fetch("/overlook/api/image?n=" + n, { headers: { "Authorization": "Bearer " + token } })
      .then((response) => response.ok ? response.blob() : Promise.reject(new Error("image " + n)))
      .then((blob) => URL.createObjectURL(blob))
      .catch((error) => { imageUrls.delete(n); throw error; }));
  }
  return imageUrls.get(n);
}

function zoomable(img) {
  img.onclick = (event) => {
    event.stopPropagation();
    if (!img.src) return;
    photoBrowser?.close();
    photoBrowser = app.photoBrowser.create({ photos: [img.src], type: "standalone", theme: app.darkMode ? "dark" : "light",
      on: { closed(browser) {
        if (photoBrowser === browser) photoBrowser = null;
        setTimeout(() => { browser.modal?.destroy(); browser.destroy(); }, 0);
      } } });
    photoBrowser.open();
  };
  return img;
}

function imageStrip(numbers) {
  const strip = el("div", "images");
  for (const n of numbers) {
    const img = zoomable(el("img"));
    img.alt = "image " + n;
    imageUrl(n).then((url) => { img.src = url; }, () => img.remove());
    strip.append(img);
  }
  return strip;
}

function choiceButtons(agent, container) {
  container.replaceChildren(...agent.choices.map((choice) => {
    const button = el("button");
    button.append(el("b", "", choice.key), choice.label);
    button.onclick = async (event) => {
      event.stopPropagation();
      button.disabled = true;
      try { await call("POST", "choose", { id: agent.id, key: choice.key }); }
      catch (error) { toast(error.message); button.disabled = false; }
    };
    return button;
  }));
}

let shownHeader = "";
let agentControls = {};
let shownAgent = null;
function markSeen() {
  if (shownAgent?.status !== "done" || shownAgent.id !== current() || document.hidden) return;
  call("POST", "seen", { id: shownAgent.id }).catch(() => {});
}

function renderHeader(agent) {
  shownAgent = agent;
  markSeen();
  const key = JSON.stringify(agent);
  if (key === shownHeader) return;
  shownHeader = key;
  $("heading").replaceChildren(el("span", "navigation-title", agent.title || "Conversation"),
    el("span", "navigation-subtitle", `${agent.agent || "Agent"} · ${statusLabel(agent.status)}`));
  $("context").hidden = !Number.isFinite(agent.context);
  $("context").replaceChildren(...(Number.isFinite(agent.context)
    ? [`Context used · ${Math.round(agent.context)}%`] : []));
  agentControls = agent.controls || {};
  $("steer").hidden = !agentControls.steer;
  const actions = [...(agentControls.steer ? ["steer"] : []), ...(agentControls.actions || [])];
  $("session-menu").hidden = !actions.length;
  $("session-menu").setAttribute("aria-label", "Session menu");
  $("session-menu").onclick = () => {
    if (sessionPending) return;
    const id = current();
    const labels = { steer: "Steer with current draft", stop: "Stop current task", reload: "Reload", restart: "New conversation", fork: "Fork" };
    app.actions.create({ buttons: [actions.map((action) => ({ text: htmlText(labels[action] || action),
      color: action === "stop" || action === "restart" ? "red" : undefined,
      onClick: () => { if (current() === id) sessionAction(action, $("session-menu")); }
    })), [{ text: "Cancel", color: "gray" }]], destroyOnClose: true }).open();
  };
  renderSlashCommands();
  renderLive(agent);
}

function renderSlashCommands() {
  if (composing) return;
  const text = $("text").value;
  const commands = text.startsWith("/") && !/\s/.test(text)
    ? (agentControls.slash || []).filter((command) =>
      command.name.replace(/^\$/, "").startsWith(text.slice(1).replace(/^\$/, ""))) : [];
  const rows = [];
  for (const skill of [false, true]) {
    const group = commands.filter((command) => command.name.startsWith("$") === skill);
    if (!group.length) continue;
    rows.push(el("div", "command-group", skill ? "Skills" : "Commands"));
    for (const command of group) {
      const item = el("button");
      item.append(el("span", "command-name", skill ? command.name.slice(1) : "/" + command.name));
      if (command.description) item.append(el("span", "command-description", command.description));
      item.title = command.description;
      item.onclick = () => {
        $("text").value = "/" + command.name + " ";
        $("text").dispatchEvent(new Event("input"));
        $("text").focus();
      };
      rows.push(item);
    }
  }
  $("slash-commands").replaceChildren(...rows);
}

const drafts = new Map();
let composeId = null;
let composing = false;
function draft(id) {
  if (!drafts.has(id)) drafts.set(id, { text: "", revision: 0, previews: [], uploading: 0, pending: false, attempts: new Map(), pendingAttachments: [] });
  return drafts.get(id);
}
function saveCompose() {
  if (composeId) draft(composeId).text = $("text").value;
}
// iOS never resizes the layout for the keyboard, so the page itself stays still and fits the
// visual viewport; only the content inside it scrolls.
function fitShell() {
  const viewport = window.visualViewport;
  if (!viewport || viewport.scale > 1) return;
  document.body.style.height = viewport.height + "px";
  document.body.style.top = Math.max(0, viewport.offsetTop) + "px";
}
const keyboardOpen = () => {
  const viewport = window.visualViewport;
  return !!viewport && !(viewport.scale > 1) && innerHeight - viewport.height >= 1;
};
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", fitShell);
  window.visualViewport.addEventListener("scroll", fitShell);
}
fitShell();
// With the keyboard up iOS pans the page on any drag that nothing inside can absorb.
document.addEventListener("touchmove", (event) => {
  if (!keyboardOpen()) return;
  const scroller = event.target.closest?.(".page-content, textarea, #slash-commands, .dialog-inner");
  if (!scroller || scroller.scrollHeight <= scroller.clientHeight) event.preventDefault();
}, {passive: false});
function resizeCompose() {
  if (!composing) {
    const box = $("text");
    box.style.height = "44px";
    const height = Math.max(44, box.scrollHeight + 2);
    const limit = Math.max(44, (window.visualViewport?.height || innerHeight) * 0.4);
    box.style.maxHeight = limit + "px";
    box.style.height = height + "px";
    box.style.overflowY = height > limit ? "auto" : "hidden";
  }
}
function syncCompose() {
  if (!composeId) return;
  const state = draft(composeId);
  if (!composing && $("text").value !== state.text) $("text").value = state.text;
  $("previews").replaceChildren(...state.previews);
  resizeCompose();
  $("send").disabled = $("steer").disabled = state.pending || state.uploading > 0;
  renderSlashCommands();
}
function appendText(state, text) {
  state.text = (state.text.trim() ? state.text.replace(/\s*$/, " ") : "") + text + " ";
}
function randomRequestId() {
  return Array.from(crypto.getRandomValues(new Uint8Array(16)), n => n.toString(16).padStart(2, "0")).join("");
}

function requestId(state, action, text) {
  const key = JSON.stringify([action, text]);
  if (!state.attempts.has(key)) state.attempts.set(key,
    randomRequestId());
  return state.attempts.get(key);
}
function acknowledge(id, state, revision, text) {
  state.attempts.clear();
  if (state.revision === revision && state.text.trim() === text) {
    state.text = "";
    state.previews.forEach(node => URL.revokeObjectURL(node.src));
    state.previews = [];
  }
  if (composeId === id) syncCompose();
}
let sessionPending = false;
async function sessionAction(action, button) {
  if (sessionPending) return;
  const generation = viewGeneration;
  saveCompose();
  const id = current();
  const state = draft(id);
  if (state.pending || state.uploading) return;
  const revision = state.revision;
  const text = action === "steer" ? state.text.trim() : "";
  if (action === "steer" && (!text || composing)) return;
  sessionPending = true;
  state.pending = true;
  syncCompose();
  button.disabled = true;
  try {
    const body = { id, action, text, confirmations: [],
      requestId: requestId(state, action, text) };
    let result;
    for (;;) {
      result = await call("POST", "session", body);
      if (generation !== viewGeneration) return;
      if (!result.confirm) break;
      if (!await confirmAction(result.confirm)) return;
      if (generation !== viewGeneration) return;
      body.confirmations.push(result.confirm);
      body.confirmationToken = result.confirmationToken;
    }
    state.attempts.clear();
    if (action === "steer") {
      saveCompose();
      acknowledge(id, state, revision, text);
      toast("Steer sent");
    } else if (action === "stop") {
      toast("Stop requested");
    } else if (current() === id) {
      open(result.agent);
    }
  } catch (error) { toast(error.message); }
  finally { sessionPending = false; state.pending = false; button.disabled = false; syncCompose(); }
}

function postOnClick(button, path, body) {
  button.onclick = async () => {
    button.disabled = true;
    try { await call("POST", path, body); }
    catch (error) { toast(error.message); button.disabled = false; }
  };
}

// What happens now, under the feed: the answers the agent waits for, or
// that it works, then the prompts queued for it.
function renderLive(agent) {
  const bottom = atBottom();
  const parts = [];
  if (typeof agent.queueError === "string" && agent.queueError) {
    const failure = el("div", "item error", "Not sent: " + agent.queueError);
    const retry = el("button", "", "Retry");
    postOnClick(retry, "retry", { id: agent.id });
    failure.append(retry);
    parts.push(failure);
  }
  if (agent.choices.length) {
    const choices = el("div", "choices");
    choiceButtons(agent, choices);
    parts.push(choices);
  } else if (agent.status === "working") {
    const working = el("div", "working");
    const preloader = el("span", "preloader");
    app.preloader.init(preloader);
    working.append(preloader);
    if (agent.brief) working.append(el("span", "", agent.brief));
    parts.push(working);
  }
  for (const item of agent.queueItems || agent.queued.map(text => ({text}))) {
    const {text, id: queueId} = item;
    const node = el("div", "item prompt queued");
    const cancel = el("button", "unqueue", "✕");
    cancel.title = "Do not send";
    postOnClick(cancel, "unqueue", { id: agent.id, text, queueId });
    node.append(el("span", "", text), el("small", "", "queued"), cancel);
    parts.push(node);
  }
  $("d-live").replaceChildren(...parts);
  if (bottom) scrollToBottom();
}

function diffPre(text) {
  const pre = el("pre", "diff");
  for (const line of text.split("\n")) {
    const kind = line.startsWith("@@") ? "hunk"
          : line.startsWith("+") && !line.startsWith("+++") ? "add"
          : line.startsWith("-") && !line.startsWith("---") ? "del" : "";
    pre.append(el("span", kind, line + "\n"));
  }
  return pre;
}

const toolMarks = { pending: "○", in_progress: "◐", completed: "✓", failed: "✗" };

function renderTool(node, item) {
  const wasOpen = node.querySelector("details")?.open;
  node.className = "item tool " + item.status;
  const head = el("div", "tool-head");
  head.append(el("span", "tool-mark", toolMarks[item.status] || "•"),
              el("span", "", item.title || item.kind || "tool"),
              el("span", "meta", ({pending:"Waiting", in_progress:"Running", completed:"Done", failed:"Failed"})[item.status] || item.status));
  const parts = [head];
  if (item.diff) {
    const details = el("details");
    details.open = wasOpen ?? false;
    details.append(el("summary", "", "diff"), diffPre(item.diff));
    parts.push(details);
  }
  if (item.images.length) parts.push(imageStrip(item.images));
  node.replaceChildren(...parts);
}

const atBottom = () => {
  const detail = $("detail");
  return detail.scrollTop + detail.clientHeight >= detail.scrollHeight - 80;
};
function scrollToBottom() {
  $("detail").scrollTop = $("detail").scrollHeight;
  $("latest").hidden = true;
}
let pinned = true;
$("detail").addEventListener("scroll", () => {
  pinned = atBottom();
  $("latest").hidden = pinned || !current();
  $("latest").style.bottom = ($("compose").getBoundingClientRect().height + 12) + "px";
}, {passive: true});
$("latest").onclick = () => { pinned = true; scrollToBottom(); };
if (window.ResizeObserver) new window.ResizeObserver(() => { if (pinned) scrollToBottom(); }).observe($("detail"));

// A reply's markdown, drawn at most four times a second as it streams.
function renderReply(node) {
  const wait = node.drawn + 250 - Date.now();
  if (wait > 0) {
    node.timer ??= setTimeout(() => { node.timer = null; renderReply(node); }, wait);
    return;
  }
  const bottom = atBottom();
  node.drawn = Date.now();
  node.innerHTML = markdown(node.source);
  if (node.images.length) node.append(imageStrip(node.images));
  if (bottom) scrollToBottom();
}

// False when a reply's text does not follow on what the node holds.
function renderItem(follow, item) {
  let node = follow.nodes.get(item.item);
  const fresh = !node;
  if (fresh) {
    node = el("div");
    follow.nodes.set(item.item, node);
  }
  switch (item.type) {
    case "prompt": node.className = "item prompt"; node.textContent = item.text; break;
    case "text":
      if ((node.source ?? "").length !== item.offset) return false;
      node.className = "item markdown";
      node.source = (node.source ?? "") + item.text;
      node.images = item.images;
      node.drawn ??= 0;
      renderReply(node);
      break;
    case "tool": renderTool(node, item); break;
    case "end": node.className = "item end"; node.textContent = "End of turn"; break;
    case "error": node.className = "item error"; node.textContent = item.text; break;
  }
  if (!["tool", "text"].includes(item.type) && item.images.length) node.append(imageStrip(item.images));
  if (fresh) $("d-feed").append(node);
  return true;
}

function nodeTitle(node) {
  return node.title || "Untitled";
}

function formatDuration(seconds) {
  const minutes = Math.floor(seconds / 60);
  return minutes ? `${minutes}m ${Math.floor(seconds % 60)}s` : `${Math.floor(seconds)}s`;
}

function statusLabel(status) {
  return ({working: "Working", waiting: "Needs attention", failed: "Failed", done: "Completed",
    idle: "Ready", saved: "Saved", open: "To do"})[status] || status || "";
}

function nodeActions(box, node) {
  const buttons = [];
  if (node.diff) buttons.push({ text: "View changes", onClick: () => showDiff(box, node) });
  for (const command of node.commands || []) buttons.push({ text: htmlText(command.label),
    color: command.confirm ? "red" : undefined,
    onClick: () => {
      if (command.input || command.options) openPanel(box, node, { name: command.name });
      else runCommand(node, command, {}, box);
    } });
  app.actions.create({ buttons: [buttons, [{ text: "Cancel", color: "gray" }]], destroyOnClose: true }).open();
}

function usageInto(container, node) {
  const heading = el("div", "usage-account");
  heading.append(icon(node.provider), el("span", "", node.provider[0].toUpperCase() + node.provider.slice(1)));
  if (node.account) heading.append(el("span", "usage-account-name", node.account));
  container.append(heading);
  const windows = el("div", "usage-windows");
  for (const item of node.windows || []) {
    const window = el("div", "usage-window");
    const caption = el("div", "usage-caption");
    const label = ({"5h": "5 hours", "7d": "7 days"})[item.label] || item.label;
    caption.append(el("span", "usage-label", label),
      el("span", "usage-value", typeof item.value === "number" ? `${Math.floor(item.value)}%` : item.value));
    window.append(caption);
    if (typeof item.value === "number") {
      const progress = el("div", "progressbar");
      progress.setAttribute("role", "progressbar");
      progress.setAttribute("aria-label", item.label + " usage");
      progress.setAttribute("aria-valuemin", "0");
      progress.setAttribute("aria-valuemax", "100");
      progress.setAttribute("aria-valuenow", item.value);
      const fill = el("span");
      fill.style.transform = `translate3d(${Math.min(100, Math.max(0, item.value)) - 100}%,0,0)`;
      progress.append(fill);
      if (item.value >= 80) window.classList.add("warning");
      window.append(progress);
    }
    if (item.reset) {
      const reset = typeof item.reset === "number" ? new Date(item.reset * 1000).toLocaleString([], {
        weekday: "short", hour: "numeric", minute: "2-digit" }) : item.reset;
      window.append(el("span", "usage-reset", "Reset · " + reset));
    }
    windows.append(window);
  }
  container.append(windows);
}

function renderNode(node) {
  const box = el("li", "remote-item");
  const usage = node.kind === "usage";
  const task = node.kind === "todo";
  const agent = node.kind === "agent" || node.kind === "saved";
  const navigates = !!node.agent || node.children.length > 0;
  const actionable = navigates || node.diff || node.commands?.length;
  const hasMenu = !!node.commands?.length;
  const row = el(actionable ? "button" : "div", "remote-row item-content" +
    ((navigates || node.diff) && !hasMenu ? " item-link" : ""));
  const inner = el("div", "item-inner");
  const line = el("div", "line" + (agent ? " agent" : ""));
  const text = el("div", "text");
  if (usage) {
    box.classList.add("usage-row");
    usageInto(text, node);
  } else {
    const title = el("span", "row-title", nodeTitle(node));
    text.append(title);
    if (node.subtitle) text.append(el("span", "row-subtitle", node.subtitle));
    if (agent) {
      const meta = el("div", "agent-meta");
      const state = el("span", "agent-state state-" + (node.status || "idle"), statusLabel(node.status));
      meta.append(state);
      if (Number.isFinite(node.durationSeconds)) meta.append(el("span", "", formatDuration(node.durationSeconds)));
      else if (node.duration) meta.append(el("span", "", node.duration));
      if (Number.isFinite(node.context)) meta.append(el("span", "", `Context ${Math.round(node.context)}%`));
      text.append(meta);
    }
    if (node.kind === "repo" && node.branch) text.append(el("span", "row-subtitle", node.branch));
    if (node.added || node.removed) {
      const counts = el("span", "change-counts");
      if (node.added) counts.append(el("span", "added", `+${node.added}`));
      if (node.removed) counts.append(el("span", "removed", `−${node.removed}`));
      text.append(counts);
    }
    if (task && node.due) text.append(el("span", "task-due", "Due " + node.due));
  }
  line.append(text);
  if (!usage) {
    const media = el("div", "item-media row-icon");
    if (agent) {
      box.classList.add("conversation-row");
      media.classList.add("agent-icon");
      media.append(icon(node.provider || "agent"));
    } else if (task) {
      box.classList.add("task-row");
      const done = node.commands?.find(command => command.name === "done");
      if (done) {
        const check = el("button", "task-check");
        check.type = "button";
        check.setAttribute("aria-label", "Complete: " + nodeTitle(node));
        check.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="9"/></svg>';
        check.onclick = () => runCommand(node, done, {}, check);
        // Keep the completion control beside, rather than inside, the row button.
        box.append(check);
      }
      media.classList.add("task-icon");
      media.style.alignSelf = "flex-start";
      media.style.marginTop = "18px";
      media.innerHTML = done ? '<span class="task-spacer"></span>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/>' +
        (node.status === "waiting" ? '<path d="M12 6v6l4 2"/>' : '') + '</svg>';
    } else if (node.kind === "file" || node.diff && !node.children.length) {
      box.classList.add("file-row");
      media.classList.add("file-icon");
      media.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8l-5-5Z"/><path d="M14 3v5h5M8 12h8M8 16h5"/></svg>';
    } else if (node.children.length || node.heading) {
      box.classList.add("group-row");
      media.classList.add("group-icon");
      media.innerHTML = '<svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M3 10V8a2 2 0 0 1 2-2h6l2.5 3H23a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V10Z"/></svg>';
      const countAgents = nodes => nodes.reduce((sum, child) => sum + (child.agent ? 1 : countAgents(child.children)), 0);
      const count = countAgents(node.children);
      if (count) line.append(el("span", "group-count", String(count)));
    }
    if (media.childNodes.length) row.append(media);
  }
  inner.append(line);
  row.append(inner);
  if (actionable) {
    row.type = "button";
    row.onclick = () => {
      if (node.agent) open(node.agent);
      else if (node.children.length) openGroup(node.id);
      else if (node.diff) showDiff(box, node);
      else nodeActions(box, node);
    };
  }
  box.append(row);
  if (hasMenu) {
    box.classList.add("has-menu");
    const more = el("button", "more", "⋯");
    more.setAttribute("aria-label", "Actions for " + nodeTitle(node));
    more.onclick = () => nodeActions(box, node);
    box.append(more);
  }
  if (node.agent && node.choices?.length) {
    const choices = el("div", "choices");
    choiceButtons({ id: node.agent, choices: node.choices }, choices);
    box.append(choices);
  }
  return box;
}

let dashboardSections = [];
const dashboardScroll = new Map();
let dashboardRoute = null;
let pendingDashboardScroll = null;
function dashboardPath(id, nodes = dashboardSections, parents = []) {
  for (const node of nodes) {
    const path = [...parents, node];
    if (node.id === id) return path;
    const nested = dashboardPath(id, node.children, path);
    if (nested) return nested;
  }
  return null;
}

function dashboardGroup(title, nodes) {
  const section = el("section", "dashboard-section");
  if (title) section.append(el("h2", "block-title", title));
  const list = el("div", "list list-inset list-strong list-dividers");
  const rows = el("ul");
  rows.append(...nodes.map(renderNode));
  list.append(rows);
  section.append(list);
  return section;
}

// Keep the dashboard stable while a row's sheet holds input.
let panel = null;
let pendingSections = null;

function closePanel() {
  const previous = panel;
  panel = null;
  previous?.sheet.close();
  if (pendingSections) {
    const sections = pendingSections;
    pendingSections = null;
    renderDashboard(sections);
  }
}

function panelContainer(box, node, state = {}) {
  if (panel?.box === box && panel.sheet.opened) {
    panel = { ...panel, text: "", option: null, ...state };
    const container = panel.sheet.el.querySelector(".commands");
    container.replaceChildren();
    return container;
  }
  closePanel();
  const root = el("div", "sheet-modal remote-sheet");
  const inner = el("div", "sheet-modal-inner");
  const toolbar = el("div", "toolbar");
  const bar = el("div", "toolbar-inner");
  const done = el("button", "link", "Done");
  done.onclick = closePanel;
  bar.append(el("div", "title", "overlook"), done);
  toolbar.append(bar);
  const content = el("div", "page-content");
  const container = el("div", "commands");
  content.append(container);
  inner.append(toolbar, content);
  root.append(inner);
  const sheet = app.sheet.create({ el: root, backdrop: true, closeByOutsideClick: false,
    swipeToClose: true, on: { closed() {
      if (panel?.sheet === sheet) { panel = null; closePanel(); }
      sheet.destroy();
      root.remove();
    } } });
  panel = { text: "", option: null, ...state, node, box, sheet };
  sheet.open();
  return container;
}

function openPanel(box, node, state = {}) {
  const container = panelContainer(box, node, state);
  const button = (label, className, onclick) => {
    const b = el("button", className, label);
    b.onclick = (event) => { event.stopPropagation(); onclick(b); };
    return b;
  };
  const command = node.commands.find((c) => c.name === panel.name);
  panel.sheet.el.querySelector(".toolbar .title").textContent = command?.label || nodeTitle(node);
  if (!command) {
    for (const c of node.commands) {
      container.append(button(c.label, c.confirm ? "danger" : "", (b) => {
        if (c.input || c.options) openPanel(box, node, { name: c.name });
        else runCommand(node, c, {}, b);
      }));
    }
  } else if (!command.input) {
    for (const option of command.options) {
      container.append(button(option, "", (b) => runCommand(node, command, { option }, b)));
    }
  } else {
    let select = null;
    if (command.options) {
      select = el("select");
      for (const option of command.options) select.append(new Option(option, option));
      if (panel.option) select.value = panel.option;
      select.onchange = () => { panel.option = select.value; };
      container.append(select);
    }
    const text = el("textarea");
    text.placeholder = command.input;
    text.value = panel.text;
    text.oninput = () => { panel.text = text.value; };
    container.append(text, button("Send", "primary", (b) =>
      runCommand(node, command, { text: text.value, option: select?.value }, b)));
  }
  container.append(button("Cancel", "", closePanel));
  container.querySelector("textarea")?.focus();
}

// Diffs share the command sheet.
async function showDiff(box, node) {
  const container = panelContainer(box, node);
  const active = panel;
  container.classList.add("file-diff");
  container.textContent = "Loading…";
  try {
    const { diff } = await call("GET", "diff?node=" + encodeURIComponent(node.id));
    if (panel !== active) return;
    container.replaceChildren(diff ? diffPre(diff) : el("span", "meta", "No changes"));
  } catch (error) {
    if (panel === active) closePanel();
    toast(error.message);
  }
}

const commandAttempts = new Map();
async function runCommand(node, command, args, button) {
  const generation = viewGeneration;
  button.disabled = true;
  try {
    const key = JSON.stringify([node.id, command.name, args]);
    if (!commandAttempts.has(key)) {
      if (commandAttempts.size >= 128) commandAttempts.delete(commandAttempts.keys().next().value);
      commandAttempts.set(key, { node: node.id, name: command.name, requestId: randomRequestId(), ...args });
    }
    const body = commandAttempts.get(key);
    let result = await call("POST", "command", body);
    if (generation !== viewGeneration) return;
    while (result.confirm) {
      if (!await confirmAction(result.confirm)) { commandAttempts.delete(key); button.disabled = false; return; }
      if (generation !== viewGeneration) return;
      body.confirmed = true;
      body.confirmationToken = result.confirmationToken;
      result = await call("POST", "command", body);
    }
    if (generation !== viewGeneration) return;
    commandAttempts.delete(key);
    closePanel();
    if (result.draft) appendText(draft(result.agent), result.draft);
    if (result.agent) open(result.agent);
    else toast(command.label + ": done");
  } catch (error) {
    toast(error.message);
    button.disabled = false;
  }
}

function groupContents(selected) {
  const conversations = [], tasks = [], code = [], resources = [];
  const containsDiff = node => node.diff || node.children.some(containsDiff);
  for (const node of selected.children) {
    if (node.kind === "agent" || node.kind === "saved") conversations.push(node);
    else if (node.kind === "todo" || node.kind === "tasks") tasks.push(node);
    else if (["repo", "folder", "file"].includes(node.kind) || containsDiff(node)) code.push(node);
    else resources.push(node);
  }
  const groups = [];
  for (const [title, nodes] of [["Conversations", conversations], ["To do", tasks], ["Code & changes", code], ["Resources", resources]]) {
    if (nodes.length) groups.push(dashboardGroup(title, nodes));
  }
  return groups.length ? groups : [el("p", "project-empty", "No items to show in this group yet.")];
}

function renderDashboard(sections) {
  if (panel) { pendingSections = sections; return; }
  dashboardSections = sections;
  const container = $("dashboard-content");
  const group = new URLSearchParams(location.search).get("node");
  const path = group ? dashboardPath(group) : null;
  const selected = path?.at(-1);
  $("dashboard-intro").hidden = !!group;
  if (!current()) {
    $("heading").textContent = selected ? nodeTitle(selected) : "Overlook";
    $("back").hidden = !group;
    $("session-menu").hidden = !selected || !(selected.commands?.length || selected.diff);
    $("session-menu").setAttribute("aria-label", "Group actions");
    $("session-menu").onclick = () => nodeActions(container, selected);
  }
  if (group && !selected) {
    container.replaceChildren(el("p", "empty", "This group is no longer available. Go back to your projects."));
    return;
  }
  const groups = selected ? groupContents(selected)
    : sections.map((section) => dashboardGroup(nodeTitle(section), section.children.length ? section.children : [section]));
  container.replaceChildren(...(groups.length ? groups : [el("p", "empty", "The dashboard is empty.")]));
  if (pendingDashboardScroll !== null) {
    $("dash").scrollTop = pendingDashboardScroll;
    pendingDashboardScroll = null;
  }
  const waiting = container.querySelectorAll(".choices").length;
  document.title = waiting ? `(${waiting}) Overlook` : "Overlook";
}

// The long poll of the view shown: its url() and what it does with news(),
// which throws a Stale error when it must start over from nothing.
// With stream(), news comes as server-sent events, and long polls only
// where those fail.
let poller = null;

class Stale extends Error {}

function stopPolling() {
  poller?.controller?.abort();
  poller = null;
}

// Polls until another poller takes over or the page hides; resume() picks it up again.
async function poll(mine) {
  const controller = new AbortController();
  mine.controller = controller;
  poller = mine;
  let failures = 0;
  const current = () => poller === mine && mine.controller === controller;
  while (current() && !document.hidden) {
    try {
      if (mine.stream && mine.known) {
        await listen(mine, controller.signal, current);
        continue;
      }
      const news = await call("GET", mine.url(), undefined, controller.signal);
      if (!current()) return;
      mine.news(news);
      connected();
      failures = 0;
    } catch (error) {
      if (error instanceof Stale) continue;
      if (!current() || error.name === "AbortError") return;
      if (connectionFailure(error)) return;
      if (mine.stream && error.status) { mine.stream = null; continue; }
      await sleep(Math.min(30000, 1000 * 2 ** Math.min(failures++, 5)));
    }
  }
}

// Reads mine.stream()'s events until the connection ends or goes quiet.
async function listen(mine, signal, current) {
  const quiet = new AbortController();
  const abort = () => quiet.abort();
  signal.addEventListener("abort", abort, { once: true });
  let timer;
  const wake = () => { clearTimeout(timer); timer = setTimeout(() => quiet.abort(), 60000); };
  wake();
  try {
    const response = await fetch("/overlook/api/" + mine.stream(), {
      headers: { "Authorization": "Bearer " + token }, signal: quiet.signal,
    });
    if (!response.ok || !response.body
        || !response.headers.get("Content-Type")?.startsWith("text/event-stream")) {
      const error = new Error("no stream");
      error.status = response.status;
      throw error;
    }
    if (!current()) return;
    connected();
    const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (!current()) return;
      if (done) throw new TypeError("Stream ended");
      wake();
      buffer += value;
      let end;
      while ((end = buffer.indexOf("\n\n")) >= 0) {
        const data = buffer.slice(0, end).split("\n")
          .filter((line) => line.startsWith("data:")).map((line) => line.slice(5)).join("\n");
        buffer = buffer.slice(end + 2);
        if (data) { mine.news(checkProtocol(JSON.parse(data))); connected(); }
      }
    }
  } catch (error) {
    if (error.name === "AbortError" && !signal.aborted) throw new TypeError("Connection timed out");
    throw error;
  } finally {
    clearTimeout(timer);
    signal.removeEventListener("abort", abort);
    quiet.abort();
  }
}

function resume() {
  if (!poller || document.hidden || connectionBlocked) return;
  markSeen();
  poller.controller?.abort();
  poll(poller);
}

// Nodes a dashboard sent as { same: hash } taken from what the page has.
function expand(nodes, known) {
  return nodes.map((node) => {
    if (!node.same) return { ...node, children: expand(node.children, known) };
    if (!known.has(node.same)) throw new Stale();
    return known.get(node.same);
  });
}

function index(nodes, known = new Map()) {
  for (const node of nodes) {
    known.set(node.hash, node);
    index(node.children, known);
  }
  return known;
}

function watchDashboard() {
  if (dashboardSections.length) renderDashboard(dashboardSections);
  else $("dashboard-content").replaceChildren(el("p", "empty", "Loading projects…"));
  const mine = { known: "", nodes: new Map() };
  mine.url = () => "dashboard?known=" + mine.known;
  mine.stream = () => "dashboard/stream?known=" + mine.known;
  mine.news = (news) => {
    if (news.known === mine.known) return;
    let sections;
    try { sections = expand(news.sections, mine.nodes); }
    catch (error) {
      mine.known = "";
      mine.nodes = new Map();
      throw error;
    }
    renderDashboard(sections);
    mine.nodes = index(sections);
    mine.known = news.known;
  };
  poll(mine);
}

async function followAgent(id) {
  const mine = { id, after: 0, known: "", epoch: "", nodes: new Map() };
  mine.url = () => `events?id=${encodeURIComponent(id)}&after=${mine.after}&known=${mine.known}`
    + `&epoch=${mine.epoch}`;
  mine.news = (news) => {
    if (news.reset) {
      mine.nodes.clear();
      $("d-feed").replaceChildren();
    }
    const bottom = atBottom();
    renderHeader(news.agent);
    mine.epoch = news.epoch;
    if (!news.items.every((item) => renderItem(mine, item))) {
      mine.after = 0;
      mine.nodes.clear();
      $("d-feed").replaceChildren();
      throw new Stale();
    }
    $("d-earlier").hidden = mine.nodes.size > 0;
    if (bottom && news.items.length) scrollToBottom();
    mine.after = news.seq;
    mine.known = news.known;
  };
  poller = mine;
  $("d-feed").replaceChildren();
  $("d-earlier").hidden = true;
  try {
    const agent = await call("GET", "agent?id=" + encodeURIComponent(id));
    if (poller !== mine) return;
    connected();
    renderHeader(agent);
    $("d-reply").innerHTML = agent.reply ? markdown(agent.reply) : "<p>(none yet)</p>";
    $("d-transcript").textContent = agent.transcript;
  } catch (error) {
    if (poller !== mine) return;
    if (connectionFailure(error)) return;
  }
  if (poller === mine) poll(mine);
}

function current() {
  return new URLSearchParams(location.search).get("agent");
}

let navigationDepth = history.state?.overlookDepth || 0;
let pageTransition = null;
function transitionPage(update, back = false) {
  pageTransition?.();
  if (window.matchMedia?.("(prefers-reduced-motion: reduce)").matches) { update(); return; }
  const page = document.querySelector(".remote-page");
  if (!page?.animate) { update(); return; }
  const snapshot = page.cloneNode(true);
  snapshot.classList.add("page-snapshot");
  snapshot.inert = true;
  snapshot.setAttribute("aria-hidden", "true");
  snapshot.querySelectorAll("[id]").forEach((node) => {
    node.dataset.snapshotId = node.id;
    node.removeAttribute("id");
  });
  update();
  page.parentElement.append(snapshot);
  const timing = { duration: 340, easing: "cubic-bezier(.32,.72,0,1)", fill: "both" };
  const outgoing = snapshot.animate([{ transform: "translateX(0)", opacity: 1 },
    { transform: back ? "translateX(100%)" : "translateX(-25%)", opacity: back ? 1 : .7 }], timing);
  const incoming = page.animate([{ transform: back ? "translateX(-25%)" : "translateX(100%)" },
    { transform: "translateX(0)" }], timing);
  snapshot.style.zIndex = back ? "20" : "0";
  page.style.zIndex = back ? "0" : "1";
  const cleanup = () => { outgoing.cancel(); incoming.cancel(); snapshot.remove(); page.style.zIndex = ""; };
  pageTransition = cleanup;
  incoming.finished.then(() => { if (pageTransition === cleanup) { cleanup(); pageTransition = null; } }, () => {});
}

function navigate(search, back = false, replace = false) {
  const depth = replace ? Math.max(0, navigationDepth - 1) : navigationDepth + 1;
  const query = search.toString();
  history[replace ? "replaceState" : "pushState"]({ overlookDepth: depth }, "",
    location.pathname + (query ? "?" + query : "") + location.hash);
  navigationDepth = depth;
  transitionPage(show, back);
}

function open(id) {
  const search = new URLSearchParams(location.search);
  search.set("agent", id);
  navigate(search);
}

function openGroup(id) {
  navigate(new URLSearchParams({ node: id }));
}

function goBack() {
  if (navigationDepth > 0) { history.back(); return; }
  const search = new URLSearchParams(location.search);
  if (current()) search.delete("agent");
  else {
    const path = dashboardPath(search.get("node"));
    if (path?.length > 2) search.set("node", path.at(-2).id);
    else search.delete("node");
  }
  navigate(search, true, true);
}

function show() {
  if (dashboardRoute !== null && !$("dash").hidden) dashboardScroll.set(dashboardRoute, $("dash").scrollTop);
  viewGeneration++;
  connectionBlocked = false;
  $("connection").hidden = true;
  saveCompose();
  const id = current();
  if (composeId !== id) composing = false;
  composeId = id;
  $("dash").hidden = !!id;
  $("detail").hidden = !id;
  $("latest").hidden = true;
  $("compose").hidden = !id;
  if (id) syncCompose();
  $("back").hidden = !id && !new URLSearchParams(location.search).has("node");
  document.querySelector(".remote-page").classList.toggle("home", !id && !new URLSearchParams(location.search).has("node"));
  stopPolling();
  shownHeader = "";
  agentControls = {};
  $("steer").hidden = $("session-menu").hidden = true;
  $("context").hidden = true;
  renderSlashCommands();
  pendingSections = null;
  closePanel();
  app.actions.close();
  app.dialog.close();
  photoBrowser?.close();
  if (!token) {
    $("dashboard-content").replaceChildren(el("p", "empty", "Open this page from M-x overlook-remote-url in Emacs."));
    return;
  }
  if (id) followAgent(id);
  else {
    $("heading").textContent = "Overlook";
    dashboardRoute = new URLSearchParams(location.search).get("node") || "";
    pendingDashboardScroll = dashboardScroll.get(dashboardRoute) || 0;
    watchDashboard();
  }
}

$("reconnect").onclick = () => show();
$("return-dashboard").onclick = () => navigate(new URLSearchParams(), true);
window.addEventListener("online", () => { if (!connectionBlocked) resume(); });
window.addEventListener("offline", () => connectionFailure(new TypeError("offline")));
$("back").onclick = goBack;
window.onpopstate = (event) => {
  const depth = event.state?.overlookDepth || 0;
  const back = depth < navigationDepth;
  navigationDepth = depth;
  transitionPage(show, back);
};
document.addEventListener("visibilitychange", resume);

function finishComposition() {
  composing = false;
  if (composeId) {
    const state = draft(composeId);
    state.text = $("text").value;
    state.revision++;
    for (const text of state.pendingAttachments) appendText(state, text);
    state.pendingAttachments = [];
    syncCompose();
  }
}
$("text").addEventListener("compositionstart", () => {
  composing = true;
  if (composeId) draft(composeId).revision++;
});
$("text").addEventListener("compositionend", finishComposition);
$("text").addEventListener("blur", () => { if (composing) finishComposition(); });
$("text").addEventListener("keydown", (event) => {
  if (event.key !== "Enter" || !(event.metaKey || event.ctrlKey) || event.isComposing || composing) return;
  event.preventDefault();
  $("send").click();
});
$("text").addEventListener("input", (event) => {
  if (composeId) {
    draft(composeId).text = event.target.value;
    draft(composeId).revision++;
  }
  if (event.isComposing || composing) return;
  renderSlashCommands();
  resizeCompose();
});

const sendable = ["image/png", "image/jpeg", "image/gif", "image/webp"];

async function prepare(file) {
  if (sendable.includes(file.type) && file.size <= 2500000) return file;
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, 2000 / Math.max(bitmap.width, bitmap.height));
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(bitmap.width * scale);
  canvas.height = Math.round(bitmap.height * scale);
  canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  return new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.85));
}

function base64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.slice(reader.result.indexOf(",") + 1));
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(blob);
  });
}

async function attach(file) {
  saveCompose();
  const id = current();
  const state = draft(id);
  if (state.pending) return;
  state.uploading++;
  const preview = el("img");
  preview.src = URL.createObjectURL(file);
  preview.style.opacity = ".4";
  state.previews.push(preview);
  syncCompose();
  try {
    const blob = await prepare(file);
    const { text } = await call("POST", "upload", { id, mime: blob.type, data: await base64(blob) });
    saveCompose();
    if (composing && composeId === id) state.pendingAttachments.push(text);
    else appendText(state, text);
    state.revision++;
    preview.style.opacity = "1";
  } catch (error) {
    state.previews = state.previews.filter(node => node !== preview);
    URL.revokeObjectURL(preview.src);
    toast(error.message);
  } finally {
    state.uploading--;
    if (composeId === id) syncCompose();
  }
}

$("attach").onclick = () => $("files").click();
$("files").onchange = (event) => {
  [...event.target.files].forEach(attach);
  event.target.value = "";
};

$("send").onclick = async () => {
  saveCompose();
  const id = current();
  const state = draft(id);
  const text = state.text.trim();
  if (!text || composing || state.pending || state.uploading) return;
  const revision = state.revision;
  state.pending = true;
  syncCompose();
  try {
    const { queued } = await call("POST", "prompt", { id, text,
      requestId: requestId(state, "send", text) });
    saveCompose();
    acknowledge(id, state, revision, text);
    toast(queued ? "Queued; it goes once the agent is free" : "Sent");
  } catch (error) {
    toast(error.message);
  } finally {
    state.pending = false;
    if (composeId === id) syncCompose();
  }
};

$("steer").onclick = () => sessionAction("steer", $("steer"));

show();
</script>
